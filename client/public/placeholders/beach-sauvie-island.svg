<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Collins Beach Sauvie Island beach day">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001a08"/>
      <stop offset="55%" stop-color="#050a06"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44FF88"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#39FF14" stroke-width="0.6" opacity="0.28"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <!-- canopy glow -->
  <circle cx="400" cy="360" r="140" fill="#39FF14" opacity="0.14" filter="url(#blur)"/>
  <!-- trees / island silhouette -->
  <ellipse cx="250" cy="560" rx="90" ry="120" fill="#0a1a0c" stroke="#39FF14" stroke-width="2.5"/>
  <ellipse cx="400" cy="540" rx="110" ry="150" fill="#0d1f10" stroke="#fff" stroke-width="2"/>
  <ellipse cx="560" cy="560" rx="95" ry="125" fill="#0a1a0c" stroke="#39FF14" stroke-width="2.5"/>
  <rect x="230" y="640" width="28" height="90" fill="#111"/>
  <rect x="386" y="640" width="28" height="100" fill="#111"/>
  <rect x="546" y="640" width="28" height="90" fill="#111"/>
  <!-- river band -->
  <rect x="0" y="740" width="800" height="16" fill="#39FF14"/>
  <rect x="0" y="756" width="800" height="10" fill="#fff" opacity="0.9"/>
  <rect x="0" y="766" width="800" height="12" fill="#111"/>
  <!-- water shimmer lines -->
  <path d="M60 820 Q200 800 340 820 T620 820 T760 810" fill="none" stroke="#39FF14" stroke-width="2" opacity="0.55"/>
  <path d="M80 860 Q220 845 360 860 T640 855 T740 850" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.35"/>
  <!-- frame -->
  <rect x="48" y="48" width="704" height="904" fill="none" stroke="#39FF14" stroke-width="4"/>
  <rect x="64" y="64" width="672" height="872" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.55"/>
  <!-- type -->
  <text x="400" y="180" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Black, sans-serif" font-size="34" font-weight="900" fill="#fff" letter-spacing="10">RIVER BRATS</text>
  <text x="400" y="280" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Black, sans-serif" font-size="52" font-weight="900" fill="url(#leaf)" letter-spacing="3">COLLINS</text>
  <text x="400" y="340" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Black, sans-serif" font-size="40" font-weight="900" fill="#fff" letter-spacing="6">BEACH</text>
  <text x="400" y="920" text-anchor="middle" font-family="Impact, Haettenschweiler, Arial Black, sans-serif" font-size="36" font-weight="900" fill="#39FF14" letter-spacing="4">SAUVIE ISLAND</text>
  <text x="400" y="960" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" fill="#39FF14" letter-spacing="5" opacity="0.8">BEACH DAY · PDX</text>
</svg>
