<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -8 136 126.00" data-wp-svg="true" role="img" aria-label="BAR"><title>BAR</title><style>@keyframes wp-hover{0%,100%{transform:translate(0,0) rotate(-.7deg)}50%{transform:translate(1px,-1.5px) rotate(.7deg)}}@keyframes wp-steam{0%{transform:translateY(3px);opacity:.15}65%{opacity:.45}100%{transform:translateY(-6px);opacity:.05}}@keyframes wp-snow{from{transform:translateY(-12px)}to{transform:translateY(12px)}}@keyframes wp-rock{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes wp-swim{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}.wp-head{transform-origin:50px 80px;animation:wp-hover 5.7s ease-in-out infinite;animation-delay:var(--phase,0s)}.wp-steam{animation:wp-steam 3.1s linear infinite;animation-delay:var(--phase,0s)}.wp-snow{animation:wp-snow 3.8s linear infinite;animation-delay:var(--phase,0s)}.wp-rock,.wp-fire{transform-box:fill-box;transform-origin:center;animation:wp-rock 3.4s ease-in-out infinite;animation-delay:var(--phase,0s)}.wp-swim{animation:wp-swim 4.1s ease-in-out infinite;animation-delay:var(--phase,0s)}svg[data-wp-svg][data-paused="true"] *{animation-play-state:paused!important}svg[data-wp-svg][data-reduced="true"] *{animation:none!important}@media(prefers-reduced-motion:reduce){svg[data-wp-svg] *{animation:none!important}} .wp-head[data-static]{animation:none}</style><defs><radialGradient id="wp-badge-placez-bar-glow"><stop stop-color="var(--wp-accent,#FFFFFF)" stop-opacity=".35"/><stop offset="1" stop-color="var(--wp-accent,#FFFFFF)" stop-opacity="0"/></radialGradient><linearGradient id="wp-badge-placez-bar-shine" x2=".8" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".18"/><stop offset=".35" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="wp-badge-placez-bar-pride"><stop offset="0.000" stop-color="#E40303"/><stop offset="0.111" stop-color="#FF8C00"/><stop offset="0.222" stop-color="#FFED00"/><stop offset="0.333" stop-color="#