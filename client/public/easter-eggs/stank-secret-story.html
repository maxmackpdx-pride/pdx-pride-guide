uot;play&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { scene: 'title' };\n  componentDidMount() {\n    this._tries = 0;\n    this._init();\n  }\n  _getRoot() {\n    return this.el || this.root || this.element || this.host || this.container || document;\n  }\n  _init() {\n    const root = this._getRoot();\n    const scenes = [...root.querySelectorAll('section[data-scene]')];\n    if (scenes.length < 9 && this._tries < 40) { this._tries++; setTimeout(() => this._init(), 100); return; }\n    this._root = root;\n    this.scenes = {};\n    scenes.forEach(s => { this.scenes[s.dataset.scene] = s; });\n    this._order = scenes;\n    this._onClick = (e) => {\n      const btn = e.target.closest('[data-goto]');\n      if (!btn || !this._root.contains(btn)) return;\n      e.preventDefault();\n      this.go(btn.dataset.goto);\n    };\n    root.addEventListener('click', this._onClick);\n    const cur = root.querySelector('#cursor');\n    if (cur) this._t = setInterval(() => { cur.style.visibility = cur.style.visibility === 'hidden' ? 'visible' : 'hidden'; }, 500);\n    this._layout = () => this.layout();\n    window.addEventListener('resize', this._layout);\n    this.layout();\n    if (this._isGrid()) this.applyGrid();\n    else this.show('title');\n  }\n  _isGrid() { return (this.props.mode || 'play') === 'grid'; }\n  componentDidUpdate(prev) {\n    if (!this._order) return;\n    if ((prev.mode || 'play') !== (this.props.mode || 'play')) {\n      const st = this._root.querySelector('#stage');\n      if (this._isGrid()) { this.applyGrid(); }\n      else {\n        if (st) {\n          st.querySelectorAll('svg.tree-svg, .tree-label').forEach(n => n.remove());\n          st.style.cssText = 'position:fixed;inset:0;background:#000;overflow:hidden;font-family:\\'VT323\\',monospace;user-select:none;-webkit-tap-highlight-color:transparent;';\n        }\n        document.documentElement.style.overflow = '';\n        this._order.forEach(sec => { sec.style.zoom = ''; sec.style.outline = ''; sec.style.zIndex = ''; });\n        this.layout(); this.show('title');\n      }\n    }\n  }\n  applyGrid() {\n    const st = this._root.querySelector('#stage');\n    const z = 0.2, W = 1080 * z, H = 1920 * z;\n    const colGap = 130, rowGap = 90, padL = 60, padT = 90, labelH = 40;\n    const cols = [\n      ['title'], ['arrive'], ['sniff', 'bar'], ['jock', 'upgrade'],\n      ['darkroom'], ['more', 'more2'], ['survived'], ['champions'], ['details']\n    ];\n    const edges = [\n      ['title','arrive'],['arrive','sniff'],['arrive','bar'],['arrive','darkroom'],\n      ['sniff','jock'],['sniff','darkroom'],['bar','jock'],['bar','survived'],\n      ['jock','darkroom'],['jock','upgrade'],['upgrade','darkroom'],['upgrade','bar'],\n      ['darkroom','more'],['darkroom','more2'],['more','survived'],['more','more2'],['more2','survived'],['more2','more'],['survived','champions'],['champions','details']\n    ];\n    const stepX = W + colGap;\n    const maxRows = Math.max(...cols.map(c => c.length));\n    const spanMax = maxRows * H + (maxRows - 1) * (rowGap + labelH);\n    const centerY = padT + spanMax / 2;\n    const pos = {};\n    cols.forEach((list, ci) => {\n      const total = list.length * H + (list.length - 1) * (rowGap + labelH);\n      const startY = centerY - total / 2;\n      list.forEach((name, ri) => {\n        const x = padL + ci * stepX;\n        const y = startY + ri * (H + rowGap + labelH) + labelH;\n        pos[name] = { x, y };\n      });\n    });\n    const stageW = padL * 2 + (cols.length - 1) * stepX + W;\n    const stageH = padT * 2 + spanMax + labelH;\n    if (st) {\n      st.style.cssText = 'position:relative;background:#020402;overflow:visible;';\n      st.style.width = stageW + 'px';\n      st.style.height = stageH + 'px';\n      st.style.margin = '0 auto';\n    }\n    // arrows\n    const svgNS = 'http://www.w3.org/2000/svg';\n    let svg = st.querySelector('svg.tree-svg');\n    if (svg) svg.remove();\n    svg = document.createElementNS(svgNS, 'svg');\n    svg.setAttribute('class', 'tree-svg');\n    svg.setAttribute('width', stageW); svg.setAttribute('height', stageH);\n    svg.style.cssText = 'position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible;';\n    const defs = document.createElementNS(svgNS, 'defs');\n    defs.innerHTML = '<marker id=\"ah\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L8,3 L0,6 Z\" fill=\"#33ff33\"/><\u002Fmarker>';\n    svg.appendChild(defs);\n    edges.forEach(([a, b]) => {\n      const A = pos[a], B = pos[b]; if (!A || !B) return;\n      let x1, y1, x2, y2, d;\n      if (a === b) { const cx = A.x + W / 2, ty = A.y; d = `M${cx - 30},${ty} C${cx - 60},${ty - 55} ${cx + 60},${ty - 55} ${cx + 30},${ty}`; }\n      else if (A.x === B.x) {\n        const down = A.y < B.y;\n        const side = down ? 1 : -1;\n        const ex = down ? W * 0.7 : W * 0.3;\n        x1 = A.x + ex; y1 = down ? A.y + H : A.y; x2 = B.x + ex; y2 = down ? B.y : B.y + H;\n        const bow = A.x + (down ? W + 70 : -70);\n        d = `M${x1},${y1} C${bow},${y1} ${bow},${y2} ${x2},${y2}`;\n      }\n      else { x1 = A.x + W; y1 = A.y + H / 2; x2 = B.x; y2 = B.y + H / 2; const mx = (x1 + x2) / 2; d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; }\n      const p = document.createElementNS(svgNS, 'path');\n      p.setAttribute('d', d);\n      p.setAttribute('fill', 'none');\n      p.setAttribute('stroke', '#2fbf2f');\n      p.setAttribute('stroke-width', '3');\n      p.setAttribute('marker-end', 'url(#ah)');\n      svg.appendChild(p);\n    });\n    st.appendChild(svg);\n    // labels\n    st.querySelectorAll('.tree-label').forEach(n => n.remove());\n    Object.entries(pos).forEach(([name, p]) => {\n      const lab = document.createElement('div');\n      lab.className = 'tree-label';\n      lab.textContent = name.toUpperCase();\n      lab.style.cssText = `position:absolute;left:${p.x}px;top:${p.y - labelH + 4}px;width:${W}px;text-align:center;z-index:3;font-family:'Press Start 2P',monospace;font-size:16px;color:#8bff8b;text-shadow:0 0 8px rgba(51,255,51,0.5);`;\n      st.appendChild(lab);\n    });\n    this._order.forEach(sec => {\n      const p = pos[sec.dataset.scene];\n      sec.style.display = p ? 'block' : 'none';\n      if (!p) return;\n      sec.style.position = 'absolute';\n      sec.style.left = p.x + 'px'; sec.style.top = p.y + 'px';\n      sec.style.margin = '0';\n      sec.style.transformOrigin = 'top left';\n      sec.style.transform = `scale(${z})`;\n      sec.style.zIndex = '2';\n      sec.style.outline = '3px solid #1f4d1f';\n      sec.style.outlineOffset = '0';\n      sec.style.animation = 'none';\n    });\n    document.body.style.background = '#020402';\n    document.documentElement.style.overflow = 'auto';\n  }\n  layout() {\n    if (!this._order || this._isGrid()) return;\n    const s = Math.min(innerWidth / 1080, innerHeight / 1920);\n    this._order.forEach(sec => {\n      sec.style.position = 'absolute';\n      sec.style.left = '50%'; sec.style.top = '50%'; sec.style.margin = '0';\n      sec.style.transformOrigin = 'center center';\n      sec.style.transform = `translate(-50%,-50%) scale(${s})`;\n    });\n  }\n  show(name) {\n    if (!this.scenes) return;\n    Object.entries(this.scenes).forEach(([k, sec]) => {\n      const on = k === name;\n      sec.style.display = on ? 'block' : 'none';\n      if (on) { sec.style.animation = 'none'; void sec.offsetWidth; sec.style.animation = 'sceneIn 0.35s ease-out'; }\n    });\n    this.setState({ scene: name });\n    if (name === 'details') this._startTypewriter();\n    else this._stopTypewriter();\n  }\n  go(name) {\n    if (this._isGrid()) return;\n    if (!this.scenes || !this.scenes[name]) return;\n    this.show(name);\n    try { this._root.scrollTop = 0; } catch (e) {}\n  }\n  _startTypewriter() {\n    const root = this._root;\n    const l1 = root.querySelector('#tw1'), l2 = root.querySelector('#tw2');\n    if (!l1 || !l2) return;\n    this._stopTypewriter();\n    const t1 = 'GET TICKETS NOW', t2 = 'PRIDEGUIDEPDX.COM/STANK';\n    const run = () => {\n      l1.innerHTML = '&gt;&nbsp;'; l2.innerHTML = '&gt;&nbsp;';\n      let i = 0, j = 0;\n      const step1 = () => { l1.innerHTML = '&gt;&nbsp;' + t1.slice(0, ++i); if (i < t1.length) this._a = setTimeout(step1, 35); else this._b = setTimeout(step2, 220); };\n      const step2 = () => { l2.innerHTML = '&gt;&nbsp;' + t2.slice(0, ++j); if (j < t2.length) this._c = setTimeout(step2, 35); };\n      step1();\n    };\n    run();\n    this._loop = setInterval(run, 9000);\n  }\n  _stopTypewriter() {\n    clearInterval(this._loop); clearTimeout(this._a); clearTimeout(this._b); clearTimeout(this._c);\n  }\n  componentWillUnmount() {\n    clearInterval(this._t); this._stopTypewriter();\n    if (this._root && this._onClick) this._root.removeEventListener('click', this._onClick);\n    window.removeEventListener('resize', this._layout);\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
