<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zaydar · Interactive map</title>
<script>window.addEventListener('error',function(){parent.postMessage({source:'zaydar-demo',type:'fatal'},location.origin)});</script>
<script>
(function(){
  var start=null, signaled=false;
  function collapseDock(){
    if(signaled)return;
    signaled=true;
    try{ parent.dispatchEvent(new CustomEvent('zaylist:collapse-mobile-dock')); }catch(err){}
  }
  window.addEventListener('pointerdown',function(event){start={x:event.clientX,y:event.clientY};signaled=false;},true);
  window.addEventListener('pointermove',function(event){if(!start||signaled)return;if(Math.hypot(event.clientX-start.x,event.clientY-start.y)>=5)collapseDock();},{capture:true,passive:true});
  window.addEventListener('pointerup',function(){start=null;signaled=false;},true);
  window.addEventListener('pointercancel',function(){start=null;signaled=false;},true);
  window.addEventListener('wheel',collapseDock,{capture:true,passive:true});
  window.addEventListener('touchmove',collapseDock,{capture:true,passive:true});
  try{
    var doc=parent.document;
    if(doc&&!doc.getElementById('zaydar-map-shell-overrides')){
      var style=doc.createElement('style');
      style.id='zaydar-map-shell-overrides';
      style.textContent='.zaydar-map-demo .zaydar-demo-navigation button:nth-child(5){display:none!important}';
      doc.head.appendChild(style);
    }
  }catch(err){}
})();
</script>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://tiles.mapterhorn.com" crossorigin>
<link rel="modulepreload" href="./river-flight.js?v=20260916-banks-win">

<link href="./studio.css" rel="stylesheet">
</head><body>
<div id="map"></div><canvas id="waypoint-lights" aria-label="Interactive Placez markers and floating event holograms"></canvas>
<div id="exploration-status" role="status" aria-live="polite"></div>
<div class="credit">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://openfreemap.org">OpenFreeMap</a> · OpenMapTiles</div><div id="map-status" role="status" aria-live="polite">Preparing Portland…</div>
<aside hidden aria-label="Flyover controls"><details>
<summary><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/><path d="M7 3v4m6 1v4m-7 1v4" stroke-width="3"/></svg>Flight controls<span class="chevron" aria-hidden="true">⌃</span></summary>
<div class="flight-settings">
<label>Speed <input id="speed" type="range" min="0" max="1.5" step=".05" value=".6"><output id="speed-value" for="speed">100%</output></label>
<label>Map <input id="map-opacity" type="range" min="0" max="1" step=".05" value=".75"><output id="map-value" for="map-opacity">75%</output></label>
<label class="pause"><input id="pause-flight" type="checkbox">Pause &amp; explore</label>
</div></details></aside>
