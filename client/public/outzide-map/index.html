<!doctype html>
<html lang="en"><head><script id="outzide-asset-recovery">
(()=>{
 let recovering=false;
 window.addEventListener('error',event=>{
  const target=event.target;
  if(recovering||!target||!(target.tagName==='SCRIPT'||target.tagName==='LINK'&&target.rel==='stylesheet'))return;
  recovering=true;
  const url=new URL(location.href),retried=url.searchParams.has('asset-retry');
  const show=()=>{
   const panel=document.createElement('div');
   panel.setAttribute('role','alert');
   panel.style.cssText='position:fixed;inset:0;z-index:2147483647;display:grid;place-content:center;gap:16px;padding:28px;background:#101713;color:#f2ebdd;font:16px/1.5 system-ui;text-align:center';
   const message=document.createElement('p');
   message.textContent=retried?'The map could not finish loading. Please try again.':'Reconnecting to the map…';
   panel.append(message);
   if(retried){const button=document.createElement('button');button.textContent='Reload map';button.style.cssText='padding:12px 20px;font:inherit;cursor:pointer';button.onclick=()=>{url.searchParams.delete('asset-retry');location.replace(url.href)};panel.append(button)}
   document.body.append(panel);
  };
  if(document.body)show();else document.addEventListener('DOMContentLoaded',show,{once:true});
  if(!retried)setTimeout(()=>{url.searchParams.set('asset-retry',String(Date.now()));location.replace(url.href)},1000);
 },true);
})();
</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10130f"><title>Outzide · Pacific Northwest</title><meta name="description" content="Find your corner of the Northwest. Explore trails, stays, campgrounds and nude beaches with Outzide."><link rel="stylesheet" href="assets/maplibre-gl-5.6.2.css"><link rel="stylesheet" href="style.css?v=mobile-effects-20260922"><link rel="stylesheet" href="assets/map-chrome.css?v=cascadia-20260922-motion"><link rel="stylesheet" href="assets/community-ui.css?v=destination-list-icon-20260923"><link rel="stylesheet" href="assets/map-continuity.css?v=coordinate-directions-1"><link rel="stylesheet" href="assets/list-browse.css?v=outzide-compact-20260924"><link rel="stylesheet" href="assets/waypoint-tokens.css?v=20260925"></head>
