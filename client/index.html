  <body>
    <div id="root"></div>
    <div id="boot-fallback" hidden style="display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;color:#fff;font-family:sans-serif;text-align:center;padding:32px;">
      <div style="font-size:42px;margin-bottom:12px;">🏳️‍🌈</div>
      <h1 style="font-size:1.25rem;margin:0 0 8px;">Zaylist is loading…</h1>
      <p style="opacity:0.65;max-width:320px;line-height:1.5;margin:0 0 20px;">If this screen stays blank, clear the cached app shell and try again.</p>
      <button type="button" id="boot-reload-btn" style="background:#C8FA3C;color:#000;border:none;border-radius:6px;padding:10px 24px;font-weight:700;cursor:pointer;font-size:14px;">Reload app</button>
    </div>
    <script>
      // Installed PWA users can get a stale precached shell after deploy.
      // Clear service worker caches once, then reload with fresh index.html + bundles.
      (function () {
        var key = "bundle-reload";

        function clearCachesAndReload() {
          var finish = function () {
            sessionStorage.removeItem(key);
            window.location.reload();
          };
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
              })
              .then(function () {
                if (!window.caches) return;
                return caches.keys().then(function (names) {
                  return Promise.all(names.map(function (name) { return caches.delete(name); }));
                });
              })
              .then(finish)
              .catch(finish);
            return;
          }
          finish();
        }

        window.addEventListener(
          "error",
          function (e) {
            var el = e.target;
            if (
              el &&
              el.tagName === "SCRIPT" &&
              el.src &&
              el.src.indexOf("/assets/") !== -1 &&
              !sessionStorage.getItem(key)
            ) {
              sessionStorage.setItem(key, "1");
              clearCachesAndReload();
            }
          },
          true,
        );

        function setBootFallback(show) {
          var fallback = document.getElementById("boot-fallback");
          if (!fallback) return;
          // Inline display beats the hidden attribute, so drive display directly.
          fallback.hidden = !show;
          fallback.style.display = show ? "flex" : "none";
        }

        function syncBootFallback() {
          var root = document.getElementById("root");
          if (!root) return;
          // Hide as soon as React mounts; never re-show once the app has booted.
          if (root.childElementCount > 0) setBootFallback(false);
        }

        var root = document.getElementById("root");
        if (root && window.MutationObserver) {
          var bootObserver = new MutationObserver(syncBootFallback);
          bootObserver.observe(root, { childList: true });
        }

        window.setTimeout(function () {
          var rootEl = document.getElementById("root");
          var fallback = document.getElementById("boot-fallback");
          if (rootEl && !rootEl.childElementCount && fallback) {
            setBootFallback(true);
          }
        }, 6000);

        var reloadBtn = document.getElementById("boot-reload-btn");
        if (reloadBtn) {
          reloadBtn.addEventListener("click", clearCachesAndReload);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
