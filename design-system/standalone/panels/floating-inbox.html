ound:#19e3ff;color:#050506}\n.seg b{margin-left:5px;color:inherit}\n.sheet__body{flex:1;overflow:hidden;padding:11px;display:flex;flex-direction:column;gap:8px;background:#0d0d10}\n.thread{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:11px 12px;border-radius:10px;background:#131317;border:1px solid #1e1e25}\n.thread.unread{border-color:#22222a;background:#141418}\n.thread .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:900;font-size:13px;color:#000;background:#19e3ff}\n.tr{display:flex;justify-content:space-between;gap:8px;align-items:baseline}\n.tn{font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:800;font-size:13.5px;text-transform:uppercase;color:#fff}\n.tw{font-family:var(--font-mono,ui-monospace,monospace);font-size:9px;color:#6a6a72}\n.tt{margin-top:3px;font-family:var(--font-mono,ui-monospace,monospace);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#19e3ff}\n.tb{margin-top:5px;font-size:12px;line-height:1.45;color:#9a9aa2}\n.dot{width:6px;height:6px;border-radius:50%;background:#ff1fa0;box-shadow:0 0 8px #ff1fa0;position:absolute;left:5px;top:14px}\n.sheet__search{padding:10px 11px;border-top:1px solid #17171c;background:#0a0a0c}\n.sheet__search input{width:100%;padding:8px 11px;border-radius:8px;background:#141418;border:1px solid #22222a;color:#d6d6dc;font-family:var(--font-body,Inter,sans-serif);font-size:12px}\n.fab{position:absolute;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#0d0d10;border:2px solid var(--neon-blue,#1956FF);box-shadow:0 0 0 1px #000,0 0 20px -4px rgba(25,86,255,.6);cursor:grab}\n.fab svg{width:22px;height:22px;stroke:#19e3ff;fill:none;stroke-width:2.2}\n.fab b{position:absolute;top:-5px;right:-5px;font-family:var(--font-mono,ui-monospace,monospace);font-size:9.5px;background:#ff1fa0;color:#08080a;border-radius:99px;padding:1px 6px}\n/* queue row */\n.qrow{padding:11px 12px;border-radius:10px;background:#0c0c0f;border:1px solid #1e1e25;border-left:3px solid var(--_c,#19e3ff)}\n.qtag{font-family:var(--font-mono,ui-monospace,monospace);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--_c,#19e3ff)}\n.qtitle{margin-top:5px;font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:800;font-size:14px;text-transform:uppercase;color:#fff;line-height:1.15}\n.qmeta{margin-top:4px;font-family:var(--font-mono,ui-monospace,monospace);font-size:9px;color:#6a6a72;line-height:1.5}\n.qacts{display:flex;gap:7px;margin-top:9px}\n.qbtn{padding:5px 11px;border-radius:4px;font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #39FF14;color:#39FF14;background:transparent}\n.qbtn--no{border-color:#FF4D4D;color:#FF4D4D}\n/* stats */\n.statrow{margin-bottom:11px}\n.statlbl{display:flex;justify-content:space-between;font-family:var(--font-mono,ui-monospace,monospace);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8a8a92;margin-bottom:5px}\n.track{height:6px;border-radius:999px;background:#1a1a1f;overflow:hidden}\n.fill{height:100%;border-radius:999px}\n.kindtable{width:100%;border-collapse:collapse;border:1px solid #1c1c22}\n.kindtable th{text-align:left;padding:10px 13px;background:#111114;font-family:var(--font-mono,ui-monospace,monospace);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8a8a92;border-bottom:1px solid #1c1c22}\n.kindtable td{padding:10px 13px;border-bottom:1px solid #17171c;font-size:12.5px;color:#9a9aa2;vertical-align:top;line-height:1.5}\n.kindtable tr:nth-child(even) td{background:#0c0c0f}\n.kindtable .k{font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:800;font-size:13px;text-transform:uppercase;color:#fff;white-space:nowrap}\n.kindtable .e{font-family:var(--font-mono,ui-monospace,monospace);font-size:10.5px;color:#19e3ff}\n.pal{display:flex;flex-wrap:wrap;gap:9px}\n.chip{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:7px;background:#0c0c0f;border:1px solid #1c1c22;font-family:var(--font-mono,ui-monospace,monospace);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#9a9aa2}\n.chip i{width:12px;height:12px;border-radius:3px;flex:none}\n<\u002Fstyle><\u002Fhead>\n<body>\n<h1>Floating inbox<\u002Fh1>\n<p class=\"lede\">The single inbox surface: a bottom sheet on mobile, a bottom-right panel behind a draggable button on desktop. Three tabs, three account views, and one rule that shapes all of it. Everything happens in place. Reading, replying, archiving, approving and resolving never change the URL, so you never lose the page you were on to answer a message.<\u002Fp>\n<p class=\"src\">Ported from client/src/components/InboxOverlay.tsx · FloatingInbox.tsx · context/InboxSheetContext.tsx · inbox/panel/{PersonalView,QueueView,PostsView,StatsView,sheet.ts} · docs/floating-inbox.md<\u002Fp>\n\n<h2>01 · The overlay<\u002Fh2>\n<p class=\"h2sub\">Navy neon frame, <code>#0d0d10<\u002Fcode> sheet, tabs across the top and search pinned to the bottom. Mobile sits 96px above the viewport bottom to clear the nav dock; desktop is anchored bottom right with the button beside it.<\u002Fp>\n<div class=\"stagewrap\">\n  <div class=\"stage\">\n    <div class=\"sheet\">\n      <div class=\"sheet__nav\">\n        <div class=\"sheet__tab on\">Inbox<b>7<\u002Fb><\u002Fdiv><div class=\"sheet__tab\">Posts<\u002Fdiv><div class=\"sheet__tab\">Stats<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sheet__acct\">\n        <span class=\"seg on\">Personal<b>3<\u002Fb><\u002Fspan><span class=\"seg\">Admin<b>4<\u002Fb><\u002Fspan><span class=\"seg\">Owner<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"sheet__body\">\n        <div class=\"thread unread\" style=\"position:relative\"><span class=\"dot\"><\u002Fspan>\n          <span class=\"av\" style=\"background:#ff1fa0\">MV<\u002Fspan>\n          <div><div class=\"tr\"><span class=\"tn\">Marisol Vega<\u002Fspan><span class=\"tw\">12m<\u002Fspan><\u002Fdiv>\n            <div class=\"tt\">Event: Stank Yes Coach<\u002Fdiv>\n            <div class=\"tb\">Can I bring two more people on the guest list?<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"thread\">\n          <span class=\"av\" style=\"background:#c8fa3c\">GB<\u002Fspan>\n          <div><div class=\"tr\"><span class=\"tn\">Gifting<\u002Fspan><span class=\"tw\">2h<\u002Fspan><\u002Fdiv>\n            <div class=\"tt\" style=\"color:#c8fa3c\">Gift: Pride flags, box of 20<\u002Fdiv>\n            <div class=\"tb\">Still available? I can pick up tonight.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"thread\">\n          <span class=\"av\" style=\"background:#19e3ff\">?<\u002Fspan>\n          <div><div class=\"tr\"><span class=\"tn\">Anonymous<\u002Fspan><span class=\"tw\">Thu<\u002Fspan><\u002Fdiv>\n            <div class=\"tt\">Missed connection<\u002Fdiv>\n            <div class=\"tb\">Revealed their name. Reply to keep the thread going.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"thread\">\n          <span class=\"av\" style=\"background:#b06bff\">DO<\u002Fspan>\n          <div><div class=\"tr\"><span class=\"tn\">Dee Okonkwo<\u002Fspan><span class=\"tw\">Wed<\u002Fspan><\u002Fdiv>\n            <div class=\"tt\" style=\"color:#b06bff\">Gig: ASL interpreters<\u002Fdiv>\n            <div class=\"tb\">Sending my certification over now.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sheet__search\"><input placeholder=\"Search messages\" readonly=\"\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"fab\"><svg viewBox=\"0 0 24 24\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.4 8.4 0 0 1-11.9 7.6L3 21l1.9-6.1A8.4 8.4 0 1 1 21 11.5Z\"><\u002Fpath><\u002Fsvg><b>7<\u002Fb><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"flex:1;min-width:280px;display:flex;flex-direction:column;gap:12px\">\n    <div class=\"cell\"><h4>Frame<\u002Fh4><p><code>2px solid var(--neon-blue)<\u002Fcode> with a layered blue glow, matching the site's glowing cards. Sheet <code>#0d0d10<\u002Fcode>, nav <code>#0a0a0c<\u002Fcode>, rows <code>#131317<\u002Fcode>, hover <code>#1b1b21<\u002Fcode>, hairlines <code>#1c1c22<\u002Fcode>.<\u002Fp><\u002Fdiv>\n    <div class=\"cell\"><h4>Tabs<\u002Fh4><p>INBOX, POSTS, STATS. Under INBOX, an account switcher: Personal, Admin (the shared keyholder queue) and Owner (the Owner Desk, primary owner only). Opening with pending items defaults to Admin, or Owner when only desk items wait.<\u002Fp><\u002Fdiv>\n    <div class=\"cell\"><h4>Thread detail<\u002Fh4><p>Opening a thread swaps the list for the detail in place: back header, message bubbles, reply composer, archive. The account tabs, the personal toolbar and the bottom search all hide while it is open.<\u002Fp><\u002Fdiv>\n    <div class=\"cell\"><h4>Desktop button<\u002Fh4><p>The floating button appears at 641px and up and can be dragged to reposition. It carries the attention count: unread messages plus the admin queue plus the owner desk.<\u002Fp><\u002Fdiv>\n    <div class=\"cell\"><h4>Mobile offset<\u002Fh4><p>The sheet sits 96px above the bottom because the nav dock is around 84px tall and <code>env(safe-area-inset-bottom)<\u002Fcode> resolves to 0 in-browser. Any lower and the composer tucks under the dock.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<h2>02 · Admin queue<\u002Fh2>\n<p class=\"h2sub\">Nine categories in one list, each with its own fetch, its own row mapper and its own approve and deny calls. The badge count and this list must always agree: if a category renders here it has to be counted there.<\u002Fp>\n<div class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-bottom:16px\">\n  <div class=\"qrow\" style=\"--_c:#19e3ff\">\n    <div class=\"qtag\">Event / claim<\u002Fdiv>\n    <div class=\"qtitle\">Bearracuda: Treasure Trail<\u002Fdiv>\n    <div class=\"qmeta\">Crystal Ballroom · 1332 W Burnside<br>Fri Jul 17 · submitted by @deelite<\u002Fdiv>\n    <div class=\"qacts\"><span class=\"qbtn\">Approve<\u002Fspan><span class=\"qbtn qbtn--no\">Decline<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"qrow\" style=\"--_c:#b06bff\">\n    <div class=\"qtag\">Promoter<\u002Fdiv>\n    <div class=\"qtitle\">Marisol Vega<\u002Fdiv>\n    <div class=\"qmeta\">@marisolvega · Sanctuary Club<br>Hosts two monthlies, wants claim access<\u002Fdiv>\n    <div class=\"qacts\"><span class=\"qbtn\">Approve<\u002Fspan><span class=\"qbtn qbtn--no\">Deny<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"qrow\" style=\"--_c:#ff1fa0\">\n    <div class=\"qtag\">Missed conn<\u002Fdiv>\n    <div class=\"qtitle\">Green flannel, Dyke March<\u002Fdiv>\n    <div class=\"qmeta\">Around town · posted anonymously<br>Awaiting a pass before it goes live<\u002Fdiv>\n    <div class=\"qacts\"><span class=\"qbtn\">Clear<\u002Fspan><span class=\"qbtn qbtn--no\">Remove<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<table class=\"kindtable\">\n  <tbody><tr><th style=\"width:130px\">Category<\u002Fth><th>What it is<\u002Fth><th style=\"width:210px\">Actions<\u002Fth><\u002Ftr>\n  <tr><td class=\"k\">Event / claim<\u002Ftd><td>A new event, an edit suggestion, an event claim, or a promoter application from the Submit page. Shows title, type, venue and address, date, submitter and email, description, claim reason.<\u002Ftd><td class=\"e\">submissions/:id/approve · reject<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Promoter<\u002Ftd><td>A member applying to be a verified promoter, or a pending event-claim submitter. Name, handle, email, org, event, pitch.<\u002Ftd><td class=\"e\">promoter-requests/:userId/approve · deny<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Venue claim<\u002Ftd><td>Someone claiming a directory listing as its owner. Venue name, claimant, email, reason.<\u002Ftd><td class=\"e\">business-claims/:id/approve · deny<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">New venue<\u002Ftd><td>A new business submitted to the directory. Name, type, address, phone, web, Instagram, description.<\u002Ftd><td class=\"e\">business-submissions/:id/approve · deny<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Logo<\u002Ftd><td>A venue owner submitting a new logo. Venue and image.<\u002Ftd><td class=\"e\">business-logo-requests/:id/approve · deny<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Moderation<\u002Ftd><td>Reports and notices for all admins: missed-connection reports, new-listing notices, transfers, removals, flags. Type, item or event, requester, proof.<\u002Ftd><td class=\"e\">moderation/:id/resolve<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Missed conn<\u002Ftd><td>Active missed connections awaiting a pass. Subject, venue or day, poster, body.<\u002Ftd><td class=\"e\">missed-connections/:id/approve · reject · delete<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">River Brats<\u002Ftd><td>A report on beach chat or content. Target type and id, reason, reporter, details.<\u002Ftd><td class=\"e\">river-brats/reports/:id/resolve<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Gifting<\u002Ftd><td>A reported or auto-flagged gifting post. Post title, reason, report count, message.<\u002Ftd><td class=\"e\">gifting/reports/:id/resolve · gifting/:id/reject<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h2>03 · Owner desk<\u002Fh2>\n<p class=\"h2sub\">Owner only, because it carries contact details. Six kinds, all resolved through one endpoint with a source flag.<\u002Fp>\n<table class=\"kindtable\">\n  <tbody><tr><th style=\"width:150px\">Kind<\u002Fth><th>What it is<\u002Fth><th style=\"width:150px\">Action<\u002Fth><\u002Ftr>\n  <tr><td class=\"k\">Message<\u002Ftd><td>The site contact form. Name, email, phone, page, message.<\u002Ftd><td>Reply by mail, mark done<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Sponsor<\u002Ftd><td>A sponsorship pitch. Name, email, business, type, length, message.<\u002Ftd><td>Reply, mark done<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Bug<\u002Ftd><td>A bug report from the feedback form. Description, page, severity.<\u002Ftd><td>Mark done<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Feedback<\u002Ftd><td>General feedback. Message and page.<\u002Ftd><td>Mark done<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Crash<\u002Ftd><td>Filed automatically by the error boundary when the UI crashes. Error, stack, page URL, user agent. Not a person, so there is nobody to reply to.<\u002Ftd><td>Mark done<\u002Ftd><\u002Ftr>\n  <tr><td class=\"k\">Keyholder<\u002Ftd><td>Team-access requests and admin escalations to the owner. Who, what, context.<\u002Ftd><td>Reply, mark done<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n\n<h2>04 · Stats<\u002Fh2>\n<p class=\"h2sub\">Analytics live in the third tab, not on a separate page. Horizontal bars only: a 6px pill track on <code>#1a1a1f<\u002Fcode> with one accent per section, sized against the largest row so the shape reads before the number does.<\u002Fp>\n<div class=\"stagewrap\">\n  <div class=\"cell\" style=\"flex:1;min-width:300px\">\n    <div class=\"kick\" style=\"color:#c8fa3c\"><i><\u002Fi>Events by day<\u002Fdiv>\n    <div class=\"statrow\"><div class=\"statlbl\"><span>Thu<\u002Fspan><span>18<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:48%;background:#c8fa3c\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"statrow\"><div class=\"statlbl\"><span>Fri<\u002Fspan><span>27<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:72%;background:#c8fa3c\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"statrow\"><div class=\"statlbl\"><span>Sat<\u002Fspan><span>37<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:100%;background:#c8fa3c\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"statrow\"><div class=\"statlbl\"><span>Sun<\u002Fspan><span>21<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:57%;background:#c8fa3c\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cell\" style=\"flex:1;min-width:300px\">\n    <div class=\"kick\" style=\"color:#19e3ff\"><i><\u002Fi>Queue age<\u002Fdiv>\n    <div class=\"statrow\"><div class=\"statlbl\"><span>Today<\u002Fspan><span>4<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:100%;background:#19e3ff\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"statrow\"><div class=\"statlbl\"><span>2 to 3 days<\u002Fspan><span>2<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:50%;background:#19e3ff\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"statrow\"><div class=\"statlbl\"><span>Over a week<\u002Fspan><span>1<\u002Fspan><\u002Fdiv><div class=\"track\"><div class=\"fill\" style=\"width:25%;background:#ff8c00\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div class=\"grid\" style=\"margin-top:14px\">\n  <div class=\"cell\"><h4>Bar helper<\u002Fh4><p><code>hbars(rows, color, suffix)<\u002Fcode> takes label and value pairs, finds the max, and returns a width per row with a 2% floor so an empty row is still visible.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Section heads<\u002Fh4><p>Display font at 22px for a section title; a monospace kicker at 10px and .14em with a glowing dot for the label above each chart, colored per section.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Posts tab<\u002Fh4><p>The middle tab lists what you have posted across events, check-ins and boards, and deep-links into the hub with <code>?view=posts&amp;section=…<\u002Fcode>.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<h2>05 · Palette<\u002Fh2>\n<p class=\"h2sub\">The sheet ships its own constants, ported verbatim from the design handoff. They are the source of truth for this surface, so do not swap in the general tokens.<\u002Fp>\n<div class=\"pal\">\n  <span class=\"chip\"><i style=\"background:#080809\"><\u002Fi>page 080809<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#0d0d10\"><\u002Fi>sheet 0d0d10<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#0a0a0c\"><\u002Fi>nav 0a0a0c<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#0c0c0f\"><\u002Fi>card 0c0c0f<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#131317\"><\u002Fi>list 131317<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#141418\"><\u002Fi>inset 141418<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#1b1b21\"><\u002Fi>hover 1b1b21<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#26262e\"><\u002Fi>seg 26262e<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#1c1c22\"><\u002Fi>border 1c1c22<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#1a1a1f\"><\u002Fi>divider 1a1a1f<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#CCFF00\"><\u002Fi>lime CCFF00<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#c8fa3c\"><\u002Fi>lime soft c8fa3c<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#19e3ff\"><\u002Fi>cyan 19e3ff<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#ff1fa0\"><\u002Fi>magenta ff1fa0<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#ff8c00\"><\u002Fi>orange ff8c00<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#b06bff\"><\u002Fi>purple b06bff<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#39FF14\"><\u002Fi>green 39FF14<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#FF4D4D\"><\u002Fi>red FF4D4D<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#fff\"><\u002Fi>heading fff<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#d6d6dc\"><\u002Fi>body d6d6dc<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#9a9aa2\"><\u002Fi>muted 9a9aa2<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#8a8a92\"><\u002Fi>meta 8a8a92<\u002Fspan>\n  <span class=\"chip\"><i style=\"background:#6a6a72\"><\u002Fi>faint 6a6a72<\u002Fspan>\n<\u002Fdiv>\n\n<h2>06 · Rules<\u002Fh2>\n<div class=\"grid\">\n  <div class=\"cell\"><h4>In place, always<\u002Fh4><p>No router navigation inside the overlay, ever. New actions mutate and stay. The whole point is that answering something never costs you your place.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Badge parity<\u002Fh4><p>The pending count must sum every category the admin queue renders. The owner desk is counted separately. A badge that disagrees with the list is a bug, not a rounding choice.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Archive is local<\u002Fh4><p>Archiving is client-side in <code>localStorage<\u002Fcode>, so it hides a thread for you without touching anyone else's copy.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Silent empty<\u002Fh4><p>Every queue query falls back to an empty list on error, so a failed request reads as \"nothing here\" rather than an error state. When something is missing, check the endpoint before the UI.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Private stays private<\u002Fh4><p>Missed connection and gifting replies never render publicly: the count shows, the bodies do not. Reveal is the poster's choice and theirs alone.<\u002Fp><\u002Fdiv>\n  <div class=\"cell no\"><h4>Never<\u002Fh4><p>No second inbox. The full <code>/inbox<\u002Fcode> page and the older admin page still exist, but this is the primary surface: keep endpoint parity and do not fork the queue.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
