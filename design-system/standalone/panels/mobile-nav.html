"<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\"><title>Mobile nav bar<\u002Ftitle>\n<style>/* ============================================================\n   PDX Pride Guide — Design System entry point.\n   Consumers link THIS one file. Import lines only.\n   ============================================================ */\n\n/* fonts injected by the offline host page */\n/* ============================================================\n   Zaylist, COLOR SYSTEM\n   Canonical source: repo design-system/tokens/tokens.css\n   (mirror of client/src/index.css + shared/eventWeek.ts).\n   Near-black brutalist base + one-neon-per-element accents.\n   ============================================================ */\n\n:root {\n  /* ---- SURFACES (exact) ---------------------------------- */\n  --ink-1000: #050505;   /* deepest, ring shadows / full bleed */\n  --ink-900:  #0a0a0a;   /* app background (always near-black) */\n  --ink-850:  #111111;   /* inset chips / inputs */\n  --ink-800:  #0b0b0b;   /* card surface */\n  --ink-750:  #141414;   /* raised surface / hover */\n  --ink-border: #2b2b2b; /* default 2px card border */\n  --ink-border-faint: #1a1a1a;\n  --ink-border-strong: #333333;\n\n  /* ---- PAPER (marker / sticker / day-tag fills) ---------- */\n  --paper:      #f4eee1;   /* warm off-white, day tags + paper stickers */\n  --paper-2:    #e8dfcc;\n  --paper-ink:  #101015;   /* text on paper */\n\n  /* ---- NEON PALETTE (exact hexes) ------------------------ */\n  --neon-yellow:  #CCFF00;  /* PRIMARY action (chartreuse) */\n  --neon-cyan:    #00FFFF;  /* accent pop, THU, links */\n  --neon-magenta: #FF00CC;  /* FRI, offset shadows + glows */\n  --neon-orange:  #FF6600;  /* SUN, warm pop */\n  --neon-violet:  #8800FF;  /* MON */\n  --neon-red:     #FF2400;  /* rose red */\n  --neon-green:   #00EE44;  /* general neon green */\n  --neon-blue:    #0044FF;  /* TUE */\n  --accent-pop:   var(--neon-cyan);\n  /* ~40% of decorative magenta accents shifted to cyan site-wide (2026) */\n  --accent-pop-shadow: rgba(0, 255, 255, 0.55);\n\n  /* ---- UTILITY / PANEL LAYER (\"board makeover\") ----------\n     Ink panels + softened neons for boards, hub, admin, about,\n     Nude Beaches, and other data-dense surfaces. */\n  --panel-ink:      #06060a;   /* utility page background */\n  --panel-band:     #070708;   /* full-bleed band (how-it-works, stats) */\n  --panel-card:     #0c0c0f;   /* utility card / hub panel */\n  --panel-card-2:   #0d0d10;   /* live-data tile */\n  --panel-border:   #1c1c22;   /* utility hairline */\n  --panel-border-2: #24242c;   /* tile hairline */\n  --panel-lime:     #c8fa3c;   /* softened neons: tab underlines, kickers */\n  --panel-cyan:     #19e3ff;\n  --panel-magenta:  #ff1fa0;\n  --panel-orange:   #ff8c00;\n  --panel-purple:   #b06bff;\n  /* Softened seam used under .page-header chrome */\n  --panel-seam: linear-gradient(90deg, var(--panel-lime), var(--panel-cyan), var(--panel-magenta), var(--panel-orange));\n\n  /* ---- STATUS RAMP (live-conditions tiles) --------------- */\n  --status-good:    #39FF14;\n  --status-warn:    #FFB347;\n  --status-bad:     #FF4D4D;\n  --status-neutral: #19E3FF;\n\n  /* ---- LEGACY / SEMANTIC COLOR NAMES (used across kit) ----\n     Kept as aliases so components read naturally. Values are\n     the canonical neons above. */\n  --lime:    var(--neon-yellow);   /* PRIMARY action */\n  --lime-hot:#D8FF3D;\n  --pink:    var(--neon-magenta);\n  --pink-hot:#FF33D6;\n  --cyan:    var(--neon-cyan);\n  --green:   #39FF14;              /* SAT day green (brighter than neon-green) */\n  --orange:  var(--neon-orange);\n  --purple:  var(--neon-violet);\n  --blue:    var(--neon-blue);\n  --yellow:  #FFEE00;              /* WED day + highlighter (GRAND OPENING) */\n  --amber:   #FFB23D;              /* supporting warm (donation, shops) */\n  --red:     var(--neon-red);\n\n  /* ---- NEON, softened for tints -------------------------- */\n  --lime-soft:  #CCFF0022;\n  --pink-soft:  #FF00CC22;\n  --cyan-soft:  #00FFFF22;\n  --green-soft: #39FF1422;\n  --orange-soft:#FF660022;\n  --purple-soft:#8800FF22;\n\n  /* ---- TEXT (exact) -------------------------------------- */\n  --text-hi:      #ffffff;  /* headings */\n  --text-mid:     #e6e3da;  /* body (warm off-white) */\n  --text-lo:      #999999;  /* meta / captions */\n  --text-faint:   #666666;  /* labels / hints */\n  --text-disabled:#4a4a4a;\n  --text-inverse: #000000;  /* text on neon fills */\n\n  /* ---- FLAG NODS ----------------------------------- */\n  --flag-red:    #E40303;\n  --flag-orange: #FF8C00;\n  --flag-yellow: #FFED00;\n  --flag-green:  #008026;\n  --flag-blue:   #004DFF;\n  --flag-violet: #750787;\n  --flag-trans-blue: #5BCEFA;\n  --flag-trans-pink: #F5A9B8;\n  --flag-white:      #FFFFFF;\n  --flag-brown:      #613915;\n  --flag-black:      #000000;\n\n  /* ---- SIGNATURE GRADIENTS ------------------------------- */\n  /* Rainbow bar (canonical): cyan > yellow > magenta > orange */\n  --rainbow-bar: linear-gradient(90deg, var(--neon-cyan), var(--neon-yellow), var(--neon-magenta), var(--neon-orange));\n  --grad-flag: var(--rainbow-bar);\n  /* Hero wordmark sweep: full 360deg hue rotation (spectrum tape), not a\n     two-color blend. Stops measured along the wordmark's own width, left\n     edge of Z to right edge of T; wraps back to magenta at 100% so the\n     loop reads as a spectrum. Do not reorder these stops. */\n  --grad-rainbow: linear-gradient(100deg,\n    #FF19D6 0%, #FF196C 12%, #FF5319 24%, #FFD119 34%, #9CFF19 44%,\n    #5BFF19 54%, #19F7FF 66%, #1956FF 76%, #E419FF 90%, #FF19D6 100%); /* @kind color */\n  --grad-nightglow: radial-gradient(120% 90% at 12% 0%, #1c0a30 0%, transparent 55%),\n                    radial-gradient(120% 90% at 100% 8%, #04262e 0%, transparent 55%),\n                    var(--ink-900);\n  --grad-hot:      linear-gradient(120deg, var(--neon-magenta) 0%, var(--neon-orange) 100%);\n  --grad-electric: linear-gradient(120deg, var(--neon-cyan) 0%, var(--neon-violet) 100%);\n  --grad-acid:     linear-gradient(115deg, var(--neon-cyan) 0%, var(--neon-yellow) 100%);\n\n  /* ============================================================\n     DAY COLOR SYSTEM (mirror of shared/eventWeek.ts).\n     Event calendar (rolling); the Thu to Sun weekend carries the\n     event program.\n       MON Jul 13  violet  #8800FF   (week opener)\n       TUE Jul 14  blue    #0044FF\n       WED Jul 15  yellow  #FFEE00\n       THU Jul 16  cyan    #00FFFF   (official festival kickoff)\n       FRI Jul 17  magenta #FF00CC\n       SAT Jul 18  green   #39FF14\n       SUN Jul 19  orange  #FF6600   (parade day)\n     ============================================================ */\n  --day-mon:   #8800FF;\n  --day-tue:   #0044FF;\n  --day-wed:   #FFEE00;\n  --day-thu:   #00FFFF;\n  --day-fri:   #FF00CC;\n  --day-sat:   #39FF14;\n  --day-sun:   #FF6600;\n  /* lighter text-safe versions of the dark day colors */\n  --day-mon-text: #AA66FF;\n  --day-tue-text: #4488FF;\n  /* Unknown/no day = white; multi-day venues get the pie gradient */\n  --day-unknown: #ffffff;\n  --day-multi: linear-gradient(90deg, #8800FF, #0044FF, #FFEE00, #00FFFF, #FF00CC, #39FF14, #FF6600); /* @kind color */\n\n  /* Schedule grid cards cycle these (NOT day colors; the column is the day) */\n  --schedule-accent-1: #19e3ff;\n  --schedule-accent-2: #ff6600;\n  --schedule-accent-3: #39ff14;\n  --schedule-accent-4: #a855f7;\n  --schedule-accent-5: #ff00cc;\n\n  /* ============================================================\n     SEMANTIC ALIASES\n     ============================================================ */\n  --bg-app:        var(--ink-900);\n  --bg-stage:      var(--ink-1000);\n  --bg-band:       var(--ink-850);\n  --surface-card:  var(--ink-800);\n  --surface-card-hover: var(--ink-750);\n  --surface-inset: #111111;\n\n  --text-body:     #e6e2d9;          /* live-site body (was --text-mid) */\n  --text-body-muted: #c8c4bb;\n  --text-heading:  var(--text-hi);\n  --text-meta:     var(--text-lo);\n\n  --border-default: var(--ink-border);\n  --border-faint:   var(--ink-border-faint);\n  --border-strong:  var(--ink-border-strong);\n\n  --accent:           var(--neon-yellow);   /* PRIMARY action */\n  --accent-ink:       var(--text-inverse);\n  --accent-secondary: var(--neon-magenta);\n  --link:             var(--neon-cyan);\n\n  /* Admission badges */\n  --tag-free:       var(--neon-yellow);\n  --tag-free-ink:   var(--text-inverse);\n  --tag-ticketed:   var(--neon-cyan);\n  --tag-ticketed-ink: var(--text-inverse);\n  --tag-donation:   var(--amber);\n  --tag-donation-ink: var(--text-inverse);\n\n  /* Place categories (venue directory borders) */\n  --cat-bars:    var(--neon-magenta);\n  --cat-food:    var(--neon-orange);\n  --cat-cafes:   var(--neon-green);\n  --cat-venues:  var(--neon-cyan);\n  --cat-services:var(--neon-violet);\n  --cat-shops:   var(--amber);\n  --cat-hotels:  var(--neon-blue);\n\n  /* Community board accents (one identity color per board) */\n  --board-spotted: var(--neon-magenta);  /* magenta, missed connections */\n  --board-gifting: var(--neon-yellow);   /* acid yellow, free / gifting board */\n  --board-gigs:    var(--neon-violet);   /* violet, gig posts */\n  /* Board pages read warmer, paper-toned text on the dark makeover */\n  --board-text:    #f4f1ea;\n  --board-muted:   #bdbab2;\n\n  /* Member profile accents: any of the 8 neons; magenta is default.\n     Violet/blue swap to their --day-*-text variants for text. */\n  --profile-accent-default: var(--neon-magenta);\n\n  --focus-ring:     var(--neon-cyan);\n}\n\n/* ============================================================\n   Zaylist, TYPOGRAPHY\n   Display : Barlow Condensed 700 to 900, UPPERCASE, tight.\n   Body    : Inter.\n   ============================================================ */\n\n:root {\n  /* ---- FAMILIES ------------------------------------------ */\n  --font-display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;\n  --font-body:    'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;\n  /* Mono is the official third voice (2026): utility kickers, running-head\n     nav, stat labels, live indicators. 10 to 12px, wide-tracked, uppercase. */\n  --font-mono:    ui-monospace, 'SFMono-Regular', 'Menlo', 'Consolas', monospace;\n  /* Board-surface aliases (mirror client/src/index.css) */\n  --font-board-display: var(--font-display);\n  --font-board-mono:    var(--font-body);\n\n  /* ---- WEIGHTS ------------------------------------------- */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium:  500;  /* @kind font */\n  --fw-semibold:600;  /* @kind font */\n  --fw-bold:    700;  /* @kind font */\n  --fw-heavy:   800;  /* @kind font */\n  --fw-black:   900;  /* @kind font */\n\n  /* ---- DISPLAY SCALE (Barlow Condensed, black) ----------- */\n  --display-hero:  clamp(3.5rem, 11vw, 9rem);    /* @kind font */\n  --display-1:     clamp(2.75rem, 7vw, 5.5rem);  /* @kind font */\n  --display-2:     clamp(2rem, 4.5vw, 3.5rem);   /* @kind font */\n  --display-3:     1.75rem;                       /* @kind font */\n\n  --lh-display:    0.95;        /* @kind other */\n  --tracking-display: 0.005em;  /* @kind other */\n\n  /* ---- CHROME (Barlow 700, UI labels) -------------------- */\n  --chrome-lg:  1.25rem;   /* nav @kind font */\n  --chrome-md:  1rem;      /* buttons @kind font */\n  --chrome-sm:  0.85rem;   /* chips @kind font */\n  --chrome-xs:  0.7rem;    /* badges @kind font */\n  --tracking-chrome: 0.06em;  /* @kind other */\n\n  /* ---- TITLE / HEADING (card titles, Barlow 900) --------- */\n  --title-lg:  1.5rem;    /* @kind font */\n  --title-md:  1.3125rem; /* @kind font */\n  --title-sm:  1.0625rem; /* @kind font */\n  --lh-title:  1.05;      /* @kind other */\n\n  /* ---- BODY (Inter) -------------------------------------- */\n  --body-lg:   1.125rem;  /* @kind font */\n  --body-md:   1rem;      /* @kind font */\n  --body-sm:   0.875rem;  /* @kind font */\n  --lh-body:   1.55;      /* @kind other */\n\n  /* ---- META ---------------------------------------------- */\n  --meta:      0.8125rem; /* @kind font */\n  --meta-sm:   0.6875rem; /* @kind font */\n  --lh-meta:   1.35;      /* @kind other */\n\n  /* ---- TRACKING ------------------------------------------ */\n  --tracking-tight:  -0.01em;  /* @kind other */\n  --tracking-normal: 0;         /* @kind other */\n  --tracking-wide:   0.04em;    /* @kind other */\n  --tracking-kicker: 0.14em;    /* @kind other */\n  --tracking-mono:   0.2em;     /* mono kickers @kind other */\n\n  /* ---- MONO UTILITY SIZES -------------------------------- */\n  --mono-kicker: 12px;   /* section kickers, running head @kind font */\n  --mono-label:  11px;   /* stat labels @kind font */\n  --mono-micro:  10px;   /* tile labels @kind font */\n\n  /* ---- PROSE --------------------------------------------- */\n  --prose-spacing: 1.35rem;  /* @kind other */\n}\n\n/* ---- BASE ELEMENT DEFAULTS ------------------------------- */\nbody {\n  font-family: var(--font-body);\n  font-size: var(--body-md);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  font-weight: var(--fw-regular);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Poster / display helper */\n.pdx-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-black);\n  line-height: var(--lh-display);\n  letter-spacing: var(--tracking-display);\n  text-transform: uppercase;\n  color: var(--text-heading);\n}\n\n/* Chrome label helper (Barlow 700) */\n.pdx-chrome {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--tracking-chrome);\n  text-transform: uppercase;\n  color: var(--text-heading);\n}\n\n/* Kicker chip label */\n.pdx-kicker {\n  font-family: var(--font-display);\n  font-size: var(--chrome-sm);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--tracking-kicker);\n  text-transform: uppercase;\n  color: var(--text-meta);\n}\n\n/* Mono kicker (utility layer): pair with a color + optional live dot */\n.pdx-kicker-mono {\n  font-family: var(--font-mono);\n  font-size: var(--mono-kicker);\n  letter-spacing: var(--tracking-mono);\n  text-transform: uppercase;\n  color: var(--neon-yellow);\n}\n\n/* ============================================================\n   Zaylist, SPACING, RADIUS, LAYOUT\n   4px base grid. Dense-but-scannable event lists.\n   ============================================================ */\n\n:root {\n  /* ---- SPACE SCALE (4px base) ---------------------------- */\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   20px;\n  --space-6:   24px;\n  --space-8:   32px;\n  --space-10:  40px;\n  --space-12:  48px;\n  --space-16:  64px;\n  --space-20:  80px;\n  --space-24:  96px;\n  --space-32:  128px;\n\n  /* Semantic spacing */\n  --gap-card:      var(--space-4);   /* inside cards */\n  --gap-list:      var(--space-3);   /* between event rows */\n  --gap-section:   var(--space-16);  /* between page sections */\n  --pad-card:      var(--space-5);   /* card padding */\n  --pad-page:      clamp(16px, 5vw, 48px); /* page gutter */\n\n  /* ---- CONTENT WIDTHS ------------------------------------ */\n  --w-content:  1180px;  /* main app column */\n  --w-prose:    680px;   /* readable blurb width */\n  --w-narrow:   440px;   /* forms / single column */\n\n  /* ---- RADIUS (brutalist zine: 0 to 8px; utility tiles go rounder) */\n  --radius-xs:   2px;\n  --radius-sm:   3px;\n  --radius-md:   4px;    /* default card / button */\n  --radius-lg:   6px;\n  --radius-xl:   8px;\n  --radius-tile: 10px;   /* utility-layer data tiles (directory, live cards) */\n  --radius-panel: 12px;  /* utility panels (now panel, status cards) */\n  --radius-pill: 999px;\n\n  /* ---- BORDERS ------------------------------------------- */\n  --bw-hair:   1px;   /* @kind other */\n  --bw-bold:   2px;   /* @kind other */\n  --bw-chunk:  3px;   /* @kind other */\n\n  --z-base: 0;        /* @kind other */\n  --z-sticky: 100;    /* @kind other */\n  --z-nav: 200;       /* @kind other */\n  --z-overlay: 800;   /* @kind other */\n  --z-modal: 900;     /* @kind other */\n  --z-toast: 1000;    /* @kind other */\n\n  /* ---- SITE CHROME --------------------------------------- */\n  --site-header-height: 120px;  /* sticky header @kind other */\n  --hub-side-w: 266px;          /* hub sidebar @kind other */\n}\n\n/* ============================================================\n   Zaylist, EFFECTS: shadows, glows, motion\n   Canonical signatures from repo tokens:\n     --brutal-shadow : 4px 4px 0 rgba(255,0,204,0.36)  (magenta offset)\n     --glow          : 0 0 14px color-mix(cyan 18%)      (soft neon)\n     Motion          : 0.15s snappy hovers, ~4s ambient pulse\n   ============================================================ */\n\n:root {\n  /* ---- BRUTALIST OFFSET (the signature) ------------------ */\n  /* Hard magenta drop, no blur. Grows on hover. */\n  --brutal-shadow:    4px 4px 0 rgba(255,0,204,0.36);\n  --brutal-shadow-lg: 6px 6px 0 rgba(255,0,204,0.50);\n  --brutal-shadow-cyan: 4px 4px 0 rgba(0,255,255,0.32);\n  --brutal-shadow-lime: 4px 4px 0 rgba(204,255,0,0.30);\n\n  /* Generic hard offsets (zine sticker) */\n  --shadow-hard-sm: 3px 3px 0 var(--ink-1000);\n  --shadow-hard:    4px 4px 0 var(--ink-1000);\n  --shadow-hard-lg: 6px 6px 0 var(--ink-1000);\n\n  /* ---- SOFT DEPTH ---------------------------------------- */\n  --shadow-sm:  0 1px 2px rgba(0,0,0,.5);\n  --shadow-md:  0 8px 24px -8px rgba(0,0,0,.7);\n  --shadow-lg:  0 14px 30px rgba(0,0,0,.42);\n\n  /* ---- NEON GLOWS (soft, pulse-able) --------------------- */\n  --glow:        0 0 14px color-mix(in srgb, var(--neon-cyan) 18%, transparent);\n  --glow-pink:   0 0 16px color-mix(in srgb, var(--neon-magenta) 26%, transparent);\n  --glow-cyan:   0 0 16px color-mix(in srgb, var(--neon-cyan) 26%, transparent);\n  --glow-lime:   0 0 16px color-mix(in srgb, var(--neon-yellow) 24%, transparent);\n  --glow-violet: 0 0 16px color-mix(in srgb, var(--neon-violet) 30%, transparent);\n\n  /* ---- MOTION -------------------------------------------- */\n  --ease-out:    cubic-bezier(.2,.8,.2,1);      /* @kind other */\n  --ease-spring: cubic-bezier(.34,1.56,.64,1);  /* @kind other */\n  --ease-inout:  cubic-bezier(.65,0,.35,1);     /* @kind other */\n\n  --dur-fast:   150ms;   /* @kind other */ /* snappy hover */\n  --dur-base:   220ms;   /* @kind other */\n  --dur-slow:   360ms;   /* @kind other */\n  --dur-pulse:  4s;      /* @kind other */ /* ambient neon pulse */\n\n  --press-scale: 0.97;   /* @kind other */\n  --hover-lift:  -2px;   /* @kind other */\n\n  /* ---- SEAM / GRAIN / HERO STACK (2026) ------------------ */\n  --seam-h:       2px;    /* rainbow bar, thin @kind other */\n  --seam-h-thick: 2.7px;  /* header / footer seam @kind other */\n  --site-film-grain-opacity:  0.12;   /* @kind other */\n  --board-page-grain-opacity: 0.108;  /* @kind other */\n  --board-promo-grain-opacity: 0.121; /* @kind other */\n  --hero-dot-grid-opacity: 0.072;     /* @kind other */\n  /* Hero stack order: bg (0) -> video overlays (1) -> scrim (2) -> grain (3) -> content (4) */\n  --hero-layer-bg: 0;       /* @kind other */\n  --hero-layer-video: 1;    /* @kind other */\n  --hero-layer-scrim: 2;    /* @kind other */\n  --hero-layer-fx: 3;       /* @kind other */\n  --hero-layer-content: 4;  /* @kind other */\n  /* Legibility scrim over board/promo hero photos (heavier left + bottom) */\n  --board-promo-scrim:\n    linear-gradient(102deg, rgba(0,0,0,0.68) 0%, rgba(0,0,0,0.66) 32%, rgba(0,0,0,0.56) 56%, rgba(0,0,0,0.35) 100%),\n    linear-gradient(to top, rgba(0,0,0,0.64) 0%, rgba(0,0,0,0.32) 42%, rgba(0,0,0,0.04) 72%); /* @kind other */\n}\n\n/* Ambient neon pulse, driven by a per-element --dc (day/accent color) */\n@keyframes pdxPulse {\n  0%, 100% { box-shadow: 0 0 14px color-mix(in srgb, var(--dc, var(--neon-cyan)) 18%, transparent); }\n  50%      { box-shadow: 0 0 24px color-mix(in srgb, var(--dc, var(--neon-cyan)) 32%, transparent); }\n}\n/* Slow magenta glow pulse (Spotted / missed-connections cards) */\n@keyframes pdxSpotPulse {\n  0%, 100% { box-shadow: 0 0 14px rgba(255,0,204,0.25); }\n  50%      { box-shadow: 0 0 24px rgba(255,0,204,0.40); }\n}\n/* Entrance reveal: fade + short rise. Site source: .sch-block (schIn, .28s ease). */\n@keyframes pdxReveal {\n  from { opacity: 0; transform: translateY(5px); }\n  to   { opacity: 1; transform: none; }\n}\n/* Popover / menu entrance: fade + rise + slight scale. Site source: .sch-pop (schPop, .18s ease-out). */\n@keyframes pdxPop {\n  from { opacity: 0; transform: translateY(8px) scale(.98); }\n  to   { opacity: 1; transform: none; }\n}\n/* Live status blink (going dots, \"now playing\"). Site source: .sch-livedot (schPulse, 1.6s); board live dots run it at 1.8s. */\n@keyframes pdxBlink { 50% { opacity: .35; } }\n/* Utility-page entrance: hero fades up 10px over .48s; stats band follows at +0.07s. Site source: board-hero-in. */\n@keyframes pdxHeroIn {\n  from { opacity: 0; transform: translateY(10px); }\n  to   { opacity: 1; transform: none; }\n}\n/* Horizontal ticker used by the Marquee component. */\n@keyframes pdxMarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }\n\n/* ============================================================\n   WEB ANIMATION ADD-ONS (zaylist.com, 2026)\n   Six additive motion layers. Each rides an element that is\n   already on the page (never replaces it), and all are silenced\n   by calm mode + the reduced-motion query below.\n   ============================================================ */\n\n/* 01 SEAM CHARGE, the rainbow header seam doubles as the page\n   loader: it charges empty to full, a bright glint races the bar,\n   a flash caps it, then it loops until the page is ready. */\n@keyframes pdxSeamFill  { 0%{ transform: scaleX(0); } 68%{ transform: scaleX(1); } 100%{ transform: scaleX(1); } }\n@keyframes pdxSeamGlint { 0%{ transform: translateX(-165%); } 60%{ transform: translateX(150%); } 100%{ transform: translateX(150%); } }\n@keyframes pdxSeamFlash { 0%,64%{ opacity: 0; } 74%{ opacity: .5; } 88%{ opacity: 0; } 100%{ opacity: 0; } }\n\n/* 03 LIVE WAVE, a neon equalizer bar rides the LIVE NOW strip.\n   Vary duration + delay + color per bar; drops the beat on tap. */\n@keyframes pdxEqBounce { 0%,100%{ transform: scaleY(.22); } 50%{ transform: scaleY(1); } }\n\n/* 04 COUNT IT UP, stat numbers spin up from zero on reveal and\n   pop on each fresh tick while a +1 floats off. */\n@keyframes pdxNumPop  { 0%{ transform: translateY(0) scale(1); } 42%{ transform: translateY(-2px) scale(1.14); } 100%{ transform: translateY(0) scale(1); } }\n@keyframes pdxFloatUp { 0%{ opacity: 1; transform: translateY(0); } 100%{ opacity: 0; transform: translateY(-28px); } }\n\n/* 05 RSVP SPARKS, a tap throws a burst of day-colored confetti.\n   Drive each particle's direction with --tx / --ty. */\n@keyframes pdxSparkFly { to { transform: translate(var(--tx,0), var(--ty,0)) scale(.2); opacity: 0; } }\n\n/* 06 RING SHIMMER, a soft highlight arc orbits an identity ring.\n   Light only (screen blend) so chosen flag colors never shift. */\n@keyframes pdxRingShimmer { to { transform: rotate(360deg); } }\n\n/* 02 SPLIT-FLAP has no shared keyframe, it is a per-cell rotateX\n   transition flip driven in JS (see the Motion \"add-ons\" card). */\n\n/* ANIMATED RAINBOW DIVIDER, the flowing + glowing seam shared by\n   .pdx-seam, .pdx-rainbow-rule, .pdxSeam and .pdxDivider--rainbow's line.\n   Colors flow left to right and a soft rainbow glow pulses; the traveling\n   highlight reuses pdxSeamGlint above. */\n@keyframes pdxSeamFlow { from { background-position: 200% 0; } to { background-position: 0% 0; } }\n@keyframes pdxSeamGlow { 0%,100% { box-shadow: 0 0 6px rgba(0,255,255,.28); } 50% { box-shadow: 0 0 18px rgba(255,0,204,.5); } }\n\n/* Reduced motion + calm mode both silence glows/animations */\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n:root[data-calm=\"true\"] *,\n.calm * {\n  animation: none !important;\n  box-shadow: none !important;\n}\n\n/* Calm mode: rainbow dividers stay visible but static (no flow, glint, glow) */\n:root[data-calm=\"true\"] .pdx-seam,\n:root[data-calm=\"true\"] .pdx-rainbow-rule,\n:root[data-calm=\"true\"] .pdxSeam,\n:root[data-calm=\"true\"] .pdxMap__seam,\n:root[data-calm=\"true\"] .pdxDivider--rainbow .pdxDivider__line {\n  background: var(--rainbow-bar);\n  background-size: auto;\n}\n:root[data-calm=\"true\"] .pdx-seam::after,\n:root[data-calm=\"true\"] .pdx-rainbow-rule::after,\n:root[data-calm=\"true\"] .pdxSeam::after,\n:root[data-calm=\"true\"] .pdxMap__seam::after,\n:root[data-calm=\"true\"] .pdxDivider--rainbow .pdxDivider__line::after {\n  display: none;\n}\n\n/* ============================================================\n   Zaylist, DEEP GLASS / OLED-NEON (canonical, 2026)\n   Mirrors the live source of truth: master branch\n   client/src/components/ds/tokens/glass.css (deep-glass-2026-07-16).\n\n   Surface only: fill / edge / bloom / sheen / button chrome / map frame.\n   Layout, spacing, structural radii, fonts, type scale stay unchanged.\n\n   NOTE: the Nude Beaches / River Brats page keeps its OWN standards and is\n   deliberately NOT folded into this glass system. Do not apply .pdx-glass-*\n   to nb-* / rb-* surfaces.\n   ============================================================ */\n\n:root {\n  /* Accent contract: set --c (or the legacy --_c / --dc) per instance. */\n  --c: var(--_c, var(--dc, var(--neon-cyan, #19e3ff)));\n  --dir-gm: 60; /* @kind other */\n\n  /* ---- 1.1 Master card (accented) ------------------------ */\n  --glass-card-radius: 14px; /* @kind radius */\n  --glass-card-blur: 12px;   /* @kind other */\n  --glass-card-bg:\n    radial-gradient(90% 70% at 50% 46%, #000 0%, #000 34%, #030304 70%, color-mix(in srgb, var(--c) 6%, #050408) 100%),\n    radial-gradient(120% 78% at 50% 122%, color-mix(in srgb, var(--c) 18%, transparent), transparent 56%); /* @kind other */\n  --glass-card-border: 1px solid color-mix(in srgb, var(--c) 55%, #101014); /* @kind other */\n  --glass-card-shadow:\n    0 0 0 2px #000,\n    0 34px 66px -24px rgba(0,0,0,.95),\n    0 0 26px -8px color-mix(in srgb, var(--c) calc(var(--dir-gm, 60) * 1.3%), transparent),\n    0 0 13px -5px color-mix(in srgb, var(--c) calc(var(--dir-gm, 60) * 1.3%), transparent),\n    inset 0 1px 0 color-mix(in srgb, var(--c) 55%, rgba(255,255,255,.12)),\n    inset 0 0 34px -26px color-mix(in srgb, var(--c) 40%, transparent); /* @kind shadow */\n\n  /* ---- 1.1b Neutral card (no semantic accent) ------------ */\n  --glass-neutral-c1: #4a4a52; /* @kind color */\n  --glass-neutral-c2: #b8b8c2; /* @kind color */\n  --glass-card-neutral-bg:\n    radial-gradient(90% 70% at 50% 46%, #000 0%, #000 34%, #030304 70%, color-mix(in srgb, var(--glass-neutral-c1) 8%, #050408) 100%),\n    radial-gradient(120% 78% at 50% 122%, color-mix(in srgb, var(--glass-neutral-c1) 20%, transparent), transparent 56%); /* @kind other */\n  --glass-card-neutral-border: 1px solid color-mix(in srgb, var(--glass-neutral-c2) 50%, #101014); /* @kind other */\n  --glass-card-neutral-shadow:\n    0 0 0 2px #000,\n    0 34px 66px -24px rgba(0,0,0,.95),\n    0 0 26px -8px color-mix(in srgb, var(--glass-neutral-c2) calc(var(--dir-gm, 60) * 1.15%), transparent),\n    0 0 13px -5px color-mix(in srgb, var(--glass-neutral-c2) calc(var(--dir-gm, 60) * 1.15%), transparent),\n    inset 0 1px 0 color-mix(in srgb, var(--glass-neutral-c2) 55%, rgba(255,255,255,.12)),\n    inset 0 0 34px -26px color-mix(in srgb, var(--glass-neutral-c1) 45%, transparent); /* @kind shadow */\n\n  /* ---- 1.2 Sheen overlays -------------------------------- */\n  --glass-sheen: linear-gradient(133deg, rgba(255,255,255,.15), rgba(255,255,255,.03) 12%, transparent 34%); /* @kind other */\n  --glass-sheen-specular: radial-gradient(70% 55% at 108% 112%, rgba(255,255,255,.1), color-mix(in srgb, var(--c) 12%, transparent) 40%, transparent 70%); /* @kind other */\n\n  /* ---- 1.3 Refract seam ---------------------------------- */\n  --refract-seam-height: 2px; /* @kind other */\n  --refract-seam-gradient: linear-gradient(90deg,#ff2d5e,#ff9500,#ffee00,#39ff14,#00ffff,#3a6bff,#8800ff,#ff00cc,#ff2d5e); /* @kind other */\n  --glass-refract: var(--refract-seam-gradient); /* @kind other */ /* back-compat alias */\n\n  /* ---- 1.4 Poster / logo well ---------------------------- */\n  --poster-well-bg: radial-gradient(130% 130% at 50% 14%, color-mix(in srgb, var(--c) 32%, #050506), #050506 72%); /* @kind other */\n  --poster-well-floor: 4px solid var(--c); /* @kind other */\n  --poster-well-scan: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.16) 3px 4px); /* @kind other */\n\n  /* ---- 1.5 Glass buttons (Card System §16 state sheet) --- */\n  --glass-btn-radius: 9px; /* @kind radius */\n  --glass-btn-bg:\n    radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--c) 15%, #0b0b0d), #060608) padding-box,\n    linear-gradient(#000, #000) border-box; /* @kind other */\n  --glass-btn-border: 2px solid #000; /* @kind other */\n  --glass-btn-color: #fff; /* @kind color */\n  --glass-btn-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255,255,255,.08), inset 0 -6px 12px -8px rgba(0,0,0,.55); /* @kind shadow */\n  --glass-btn-hover-bg:\n    radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--c) 24%, #0b0b0d), #060608) padding-box,\n    linear-gradient(#000, #000) border-box; /* @kind other */\n  --glass-btn-hover-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255,255,255,.12), inset 0 -6px 12px -8px rgba(0,0,0,.55); /* @kind shadow */\n  --glass-btn-active-bg:\n    radial-gradient(120% 100% at 50% 0%, color-mix(in srgb, var(--c) 12%, #08080a), #050506) padding-box,\n    linear-gradient(#000, #000) border-box; /* @kind other */\n  --glass-btn-active-shadow: 0 0 0 1px #000, inset 0 2px 5px rgba(0,0,0,.7); /* @kind shadow */\n  --glass-btn-solid-bg: var(--c); /* @kind other */\n  --glass-btn-solid-color: #050506; /* @kind color */\n  --glass-btn-solid-border: 2px solid #000; /* @kind other */\n  --glass-btn-solid-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255,255,255,.65), inset 0 -6px 12px -6px rgba(0,0,0,.28); /* @kind shadow */\n  --glass-btn-outline-border: 1px solid #000; /* @kind other */\n  --glass-btn-outline-bg: rgba(0,0,0,.5); /* @kind other */\n  --glass-btn-outline-color: var(--c); /* @kind other */\n  --glass-btn-outline-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255,255,255,.08); /* @kind shadow */\n\n  /* ---- 1.6 Map surface ----------------------------------- */\n  --map-surface-bg: #06060a; /* @kind color */\n  --map-frame-shadow:\n    0 0 0 1px #000, inset 0 0 0 1px rgba(0,0,0,.85), inset 0 2px 3px rgba(0,0,0,.9),\n    inset 0 0 28px -8px rgba(0,0,0,.95), inset 0 0 52px 10px rgba(0,0,0,.42),\n    inset 0 4px 10px -2px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.045); /* @kind shadow */\n  --map-grid-bg:\n    repeating-linear-gradient(0deg, transparent 0 38px, rgba(255,255,255,.022) 38px 39px),\n    repeating-linear-gradient(90deg, transparent 0 46px, rgba(255,255,255,.022) 46px 47px),\n    radial-gradient(120% 90% at 60% 40%, #101018 0%, #06060a 70%); /* @kind other */\n  --map-vignette-bg: radial-gradient(128% 128% at 50% 50%, transparent 48%, rgba(0,0,0,.18) 72%, rgba(0,0,0,.48) 100%); /* @kind other */\n  --map-vignette-inset: inset 0 0 18px 2px rgba(0,0,0,.48), inset 0 0 56px 10px rgba(0,0,0,.4); /* @kind shadow */\n\n  /* ---- Nav deboss (§2.8) --------------------------------- */\n  --edge-deboss: inset 0 0 34px -10px rgba(0,0,0,.95), inset 0 2px 3px rgba(0,0,0,.6); /* @kind shadow */\n\n  /* ---- 1.7 Chrome (buttons / kickers / tags / tape) ------\n     Interactive chrome sits on the same OLED chassis as the cards:\n     black keyline, 1px top bevel, floor shade, accent bloom. Compose\n     these atoms, never hand-roll a stack. The flat 4px magenta offset\n     is retired from chrome and survives only on posters and collage. */\n  --chrome-radius-lg: 12px; /* @kind radius */\n  --chrome-radius-md: 10px; /* @kind radius */\n  --chrome-radius-sm: 8px;  /* @kind radius */\n  --chrome-radius-tag: 7px; /* @kind radius */\n\n  --chrome-keyline:    0 0 0 1px #000; /* @kind shadow */\n  --chrome-bevel:      inset 0 1px 0 rgba(255,255,255,.72); /* @kind shadow */\n  --chrome-bevel-dark: inset 0 1px 0 rgba(255,255,255,.12); /* @kind shadow */\n  --chrome-floor:      inset 0 -9px 14px -9px rgba(0,0,0,.32); /* @kind shadow */\n  --chrome-drop:       0 2px 5px rgba(0,0,0,.6); /* @kind shadow */\n  --chrome-press:      inset 0 2px 6px rgba(0,0,0,.4); /* @kind shadow */\n  --chrome-focus:      0 0 0 3px rgba(0,255,255,.55); /* @kind shadow */\n\n  /* Bloom is its own property so calm mode can zero it without\n     erasing the keyline and bevel that make chrome legible. */\n  --chrome-bloom:       0 10px 26px -13px color-mix(in srgb, var(--c, #CCFF00) 75%, transparent); /* @kind shadow */\n  --chrome-bloom-hover: 0 16px 34px -13px color-mix(in srgb, var(--c, #CCFF00) 95%, transparent); /* @kind shadow */\n  --chrome-bloom-sm:    0 8px 20px -13px color-mix(in srgb, var(--c, #CCFF00) 75%, transparent); /* @kind shadow */\n  --chrome-bloom-lg:    0 12px 30px -13px color-mix(in srgb, var(--c, #CCFF00) 80%, transparent); /* @kind shadow */\n\n  /* Lit fills: a vertical gradient reads as a lit surface, flat does not. */\n  --acid-lit:       linear-gradient(180deg,#E2FF5E 0%,#CCFF00 44%,#B2E400 100%); /* @kind other */\n  --acid-lit-hover: linear-gradient(180deg,#EBFF7A,#D6FF2B 44%,#BEEE00); /* @kind other */\n  --acid-lit-press: linear-gradient(180deg,#B8E800,#CCFF00); /* @kind other */\n  --acid-lit-chip:  linear-gradient(180deg,#E2FF5E,#C4F200); /* @kind other */\n  --acid-lit-tag:   linear-gradient(180deg,#DDFF4A,#C4F200); /* @kind other */\n  --acid-lit-tape:  linear-gradient(170deg,#E2FF5E,#C4F200); /* @kind other */\n  --cyan-lit:       linear-gradient(180deg,#3DFFFF,#00E2E2); /* @kind other */\n  --cyan-lit-tape:  linear-gradient(170deg,#3DFFFF,#00E9E9); /* @kind other */\n\n  --chrome-ink-fill: radial-gradient(130% 110% at 50% 0%, color-mix(in srgb, var(--c, #00FFFF) 17%, transparent), #0b0b0f 62%, #08080b); /* @kind other */\n}\n\n/* Per-instance rebind: recompute the recipes against a local --c so each\n   card/board/nav gets its own day/category/board accent instead of root cyan. */\n.pdx-glass-rebind, .pdx-glass-card, .pdx-glass, .pdxBoard, .pdxRow,\n.pdxPlace, .pdxStatCard, .pdxBoardCard, .pdxAd, .pdxActionRow, .pdxInfoTile {\n  --c: var(--_c, var(--dc, var(--neon-cyan, #19e3ff)));\n  --glass-card-bg:\n    radial-gradient(90% 70% at 50% 46%, #000 0%, #000 34%, #030304 70%, color-mix(in srgb, var(--c) 6%, #050408) 100%),\n    radial-gradient(120% 78% at 50% 122%, color-mix(in srgb, var(--c) 18%, transparent), transparent 56%);\n  --glass-card-border: 1px solid color-mix(in srgb, var(--c) 55%, #101014);\n  --glass-card-shadow:\n    0 0 0 2px #000, 0 34px 66px -24px rgba(0,0,0,.95),\n    0 0 26px -8px color-mix(in srgb, var(--c) calc(var(--dir-gm, 60) * 1.3%), transparent),\n    0 0 13px -5px color-mix(in srgb, var(--c) calc(var(--dir-gm, 60) * 1.3%), transparent),\n    inset 0 1px 0 color-mix(in srgb, var(--c) 55%, rgba(255,255,255,.12)),\n    inset 0 0 34px -26px color-mix(in srgb, var(--c) 40%, transparent);\n  --glass-sheen-specular: radial-gradient(70% 55% at 108% 112%, rgba(255,255,255,.1), color-mix(in srgb, var(--c) 12%, transparent) 40%, transparent 70%);\n}\n\n/* ---- Utility classes — set --c (or --_c) on the node ------ */\n.pdx-glass-card, .pdx-glass {\n  position: relative; overflow: visible;\n  background: var(--glass-card-bg); border: var(--glass-card-border);\n  box-shadow: var(--glass-card-shadow);\n  backdrop-filter: blur(var(--glass-card-blur)); -webkit-backdrop-filter: blur(var(--glass-card-blur));\n  animation: pgDirCardIn .55s var(--ease-out, ease) both;\n}\n.pdx-glass-card--neutral, .pdx-glass--neutral {\n  background: var(--glass-card-neutral-bg); border: var(--glass-card-neutral-border);\n  box-shadow: var(--glass-card-neutral-shadow);\n}\n.pdx-glass-card--left-accent, .pdx-glass--left { border-left: 4px solid var(--c); }\n/* Full rainbow border variant (non-profit / hero tile) */\n.pdx-glass--rainbow {\n  border: 2px solid transparent;\n  background:\n    radial-gradient(90% 70% at 50% 46%, #000 0%, #000 34%, #030304 70%, #060509 100%) padding-box,\n    var(--refract-seam-gradient) border-box;\n  box-shadow: 0 34px 66px -24px rgba(0,0,0,.95),\n    0 0 24px -2px color-mix(in srgb, var(--c) 60%, transparent),\n    0 0 62px -14px color-mix(in srgb, var(--c) 42%, transparent),\n    inset 0 3px 7px -1px rgba(0,0,0,.9), inset 0 1px 2px rgba(0,0,0,.85), inset 0 -1px 0 rgba(255,255,255,.05);\n}\n\n/* Corner sheen — child or ::before/::after */\n.pdx-glass-card::before, .pdx-glass::before, .pdx-glass-sheen {\n  content: \"\"; position: absolute; inset: 0; border-radius: inherit;\n  pointer-events: none; z-index: 2; background: var(--glass-sheen);\n}\n.pdx-glass-card::after, .pdx-glass::after, .pdx-glass-sheen--specular {\n  content: \"\"; position: absolute; inset: 0; border-radius: inherit;\n  pointer-events: none; z-index: 2; background: var(--glass-sheen-specular);\n}\n.pdx-glass-card > *, .pdx-glass > * { position: relative; z-index: 3; }\n\n/* Prismatic refraction seam — .pdx-refract-seam (master) / .pdx-refract (legacy) */\n.pdx-refract-seam, .pdx-refract, .dir-refract {\n  position: absolute; top: 0; left: 7px; right: 7px; height: var(--refract-seam-height); z-index: 5;\n  pointer-events: none; background: var(--refract-seam-gradient); background-size: 200% 100%;\n  opacity: .7; filter: blur(.2px); animation: dirRefract 7s linear infinite;\n  -webkit-mask: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);\n  mask: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);\n}\n.pdx-refract::after {\n  content: \"\"; position: absolute; top: -3px; left: 0; right: 0; height: 8px; z-index: -1;\n  background: var(--refract-seam-gradient); background-size: 200% 100%;\n  opacity: .28; filter: blur(7px); animation: dirRefract 7s linear infinite;\n  -webkit-mask: inherit; mask: inherit;\n}\n\n/* Poster / logo well */\n.pdx-poster-well, .pdx-glass-well {\n  position: relative; border-radius: 13px 13px 0 0; overflow: hidden;\n  background: var(--poster-well-bg); border-bottom: var(--poster-well-floor);\n}\n.pdx-poster-well__scan, .pdx-glass-well__scan {\n  position: absolute; inset: 0; pointer-events: none; opacity: .35; background: var(--poster-well-scan);\n}\n\n/* ---- Glass buttons ------------------------------------------ */\n.pdx-glass-btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: .5em;\n  font-family: var(--font-display); font-weight: 700; text-transform: uppercase;\n  letter-spacing: .08em; line-height: 1; padding: 11px 20px; font-size: .86rem;\n  border-radius: var(--glass-btn-radius, 9px); color: var(--glass-btn-color, #fff);\n  border: var(--glass-btn-border); background: var(--glass-btn-bg); box-shadow: var(--glass-btn-shadow);\n  cursor: pointer; text-decoration: none;\n  transition: transform .15s ease, filter .15s ease, box-shadow .15s ease, background .15s ease;\n}\n.pdx-glass-btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.06);\n  background: var(--glass-btn-hover-bg); box-shadow: var(--glass-btn-hover-shadow); text-decoration: none; }\n.pdx-glass-btn:active:not(:disabled) { transform: translateY(1px) scale(.98); filter: none;\n  background: var(--glass-btn-active-bg); box-shadow: var(--glass-btn-active-shadow); }\n.pdx-glass-btn:disabled { opacity: .55; cursor: not-allowed; color: #6a6870; transform: none; filter: none; }\n.pdx-glass-btn--solid { color: var(--glass-btn-solid-color, #050506);\n  background: var(--glass-btn-solid-bg, var(--c)); border: var(--glass-btn-solid-border, 2px solid #000);\n  box-shadow: var(--glass-btn-solid-shadow); }\n.pdx-glass-btn--outline { color: var(--glass-btn-outline-color, var(--c));\n  background: var(--glass-btn-outline-bg); border: var(--glass-btn-outline-border); box-shadow: var(--glass-btn-outline-shadow); }\n.pdx-glass-btn--gradient { color: #050506; border: 1px solid #000;\n  background: linear-gradient(100deg,#ff2400,#ff9500,#ffee00,#39ff14,#00ffff,#8800ff,#ff00cc); background-size: 180% 180%;\n  box-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255,255,255,.55), inset 0 -6px 12px -6px rgba(0,0,0,.3); }\n.pdx-glass-btn--gradient:hover:not(:disabled) { filter: brightness(1.05); background-position: 100% 50%; }\n\n/* ---- Map surface -------------------------------------------- */\n.pdx-map-surface, .pdx-map-surface--neutral {\n  position: relative; border-radius: 16px; overflow: hidden;\n  background: var(--map-surface-bg); border: 1px solid #000; box-shadow: var(--map-frame-shadow);\n}\n.pdx-map-surface__plate { position: relative; overflow: hidden; background: var(--map-grid-bg); }\n.pdx-map-surface__vignette { position: absolute; inset: 0; pointer-events: none; z-index: 1;\n  background: var(--map-vignette-bg); box-shadow: var(--map-vignette-inset); }\n.pdx-map-surface__shaft { position: absolute; top: -20%; bottom: -20%; left: 48%; width: 70px; z-index: 1;\n  pointer-events: none; transform: rotate(14deg); filter: blur(1px); opacity: .85;\n  background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015) 50%, transparent); }\n.pdx-map-pin { --_c: var(--day-sat); position: absolute; width: 18px; height: 18px; border-radius: 50%;\n  transform: translate(-50%,-50%); background: #000; border: 3px solid var(--_c); box-shadow: 0 0 12px 1px var(--_c); }\n.pdx-map-pin--multi { border: 0; box-shadow: 0 0 12px 1px rgba(255,255,255,.4);\n  background: conic-gradient(#8800ff,#0044ff,#00ffff,#39ff14,#ffee00,#ff6600,#ff00cc,#8800ff); }\n\n.pdx-edge-deboss { box-shadow: var(--edge-deboss), 0 0 22px -10px color-mix(in srgb, var(--neon-cyan, #19e3ff) 40%, transparent); }\n\n/* ---- Keyframes (pg-prefixed canonical + legacy aliases) ----- */\n@keyframes pgDirCardIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }\n@keyframes dirCardIn   { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }\n@keyframes pdxCardIn   { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }\n@keyframes dirRefract  { from { background-position: 200% 0; } to { background-position: 0 0; } }\n@keyframes pdxRefract  { from { background-position: 200% 0; } to { background-position: 0 0; } }\n@keyframes pdxPullHandle { 0%,100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(-3px); opacity: 1; background: #4a4a55; } }\n\n/* ---- Calm mode + reduced motion: zero bloom, freeze motion ---\n   Zero the bloom only. The keyline, bevel and floor stay so chrome keeps\n   its chassis. A blanket box-shadow:none must never apply to chrome. */\n:root[data-calm=\"true\"], html.calm-mode {\n  --dir-gm: 0; /* @kind other */\n  --chrome-bloom: 0 0 0 transparent; /* @kind shadow */\n  --chrome-bloom-hover: 0 0 0 transparent; /* @kind shadow */\n  --chrome-bloom-sm: 0 0 0 transparent; /* @kind shadow */\n  --chrome-bloom-lg: 0 0 0 transparent; /* @kind shadow */\n}\n:root[data-calm=\"true\"] .pdx-glass-card, :root[data-calm=\"true\"] .pdx-glass,\n:root[data-calm=\"true\"] .pdx-refract-seam, :root[data-calm=\"true\"] .pdx-refract, :root[data-calm=\"true\"] .dir-refract,\nhtml.calm-mode .pdx-glass-card, html.calm-mode .pdx-glass, html.calm-mode .pdx-refract-seam {\n  animation: none !important;\n  backdrop-filter: none !important; -webkit-backdrop-filter: none !important;\n}\n@media (prefers-reduced-motion: reduce) {\n  .pdx-glass-card, .pdx-glass, .pdx-refract-seam, .pdx-refract, .dir-refract { animation: none !important; }\n}\n\n/* No backdrop-filter support: solid OLED slab */\n@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {\n  .pdx-glass-card, .pdx-glass, .pdx-glass-card--neutral { background: #050506 !important; }\n}\n\n/* ============================================================\n   Zaylist, light base reset + shared primitives.\n   Kept minimal; tokens live in the other files.\n   ============================================================ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--bg-app);\n  color: var(--text-body);\n}\n\n/* Selection = magenta highlighter */\n::selection { background: var(--neon-magenta); color: #000; }\n\na { color: var(--link); text-decoration: none; }\na:hover { text-decoration: underline; text-underline-offset: 3px; }\n\n/* Focus, cyan ring, never removed */\n:focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 2px;\n  border-radius: var(--radius-xs);\n}\n\nimg, svg { display: block; max-width: 100%; }\n\nh1, h2, h3, h4 { margin: 0; color: var(--text-heading); }\np { margin: 0; }\n\n/* Custom scrollbar on dark */\n* { scrollbar-color: var(--ink-border-strong) transparent; }\n::-webkit-scrollbar { width: 10px; height: 10px; }\n::-webkit-scrollbar-thumb {\n  background: var(--ink-border-strong);\n  border-radius: var(--radius-pill);\n  border: 2px solid var(--bg-app);\n}\n\n/* ---- Shared brand primitives (usable in raw HTML) -------- */\n\n/* Rainbow rule / bar, the section divider (cyan > yellow > magenta > orange).\n   Animated: colors flow left to right, a white glint sweeps across, a soft\n   rainbow glow pulses. Silenced + flattened to a static bar by calm mode and\n   reduced-motion (see effects.css). */\n.pdx-rainbow-rule {\n  position: relative;\n  height: 3px;\n  border: 0;\n  overflow: hidden;\n  background: linear-gradient(90deg,\n    var(--neon-cyan), var(--neon-yellow), var(--neon-magenta), var(--neon-orange), var(--neon-cyan));\n  background-size: 200% 100%;\n  animation: pdxSeamFlow 3.4s linear infinite, pdxSeamGlow 3.4s var(--ease-inout) infinite;\n}\n.pdx-rainbow-rule::after {\n  content: \"\";\n  position: absolute; top: -1px; bottom: -1px; left: 0; width: 24%;\n  transform: translateX(-165%);\n  background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);\n  mix-blend-mode: screen; pointer-events: none;\n  animation: pdxSeamGlint 3.4s var(--ease-inout) infinite;\n}\n\n/* Text stroked in rainbow (headline accent word) */\n.pdx-text-rainbow {\n  background: var(--grad-rainbow);\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n}\n\n/* Marker / kicker chip, the neon marker used for hero kickers\n   (\"OUR EVENTS · PORTLAND\"). Barlow Condensed 700,\n   with a brutalist cyan offset behind the acid-yellow fill. */\n.pdx-marker {\n  display: inline-block;\n  position: relative;\n  transform: rotate(-1deg);\n  background: var(--neon-yellow);\n  color: #000;\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--chrome-sm);\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  padding: 6px 14px 4px;\n  border-radius: 2px;\n  box-shadow: 4px 4px 0 -1px var(--neon-cyan);\n}\n.pdx-marker--pink   { background: var(--neon-magenta); color: #fff; box-shadow: 4px 4px 0 -1px var(--neon-cyan); }\n.pdx-marker--cyan   { background: var(--neon-cyan); color: #000; box-shadow: 4px 4px 0 -1px var(--neon-yellow); }\n.pdx-marker--rainbow{ background: var(--grad-rainbow); color: #000; box-shadow: none; }\n.pdx-marker--yellow { background: var(--yellow); color: #000; box-shadow: 4px 4px 0 -1px var(--neon-magenta); }\n\n/* Rainbow seam, the thin gradient line under the header and above the\n   footer. Full flag sweep, animated to match .pdx-rainbow-rule above. */\n.pdx-seam {\n  position: relative;\n  height: 3px;\n  border: 0;\n  overflow: hidden;\n  background: linear-gradient(90deg,\n    var(--neon-cyan), var(--neon-yellow), var(--neon-magenta), var(--neon-orange), var(--neon-cyan));\n  background-size: 200% 100%;\n  animation: pdxSeamFlow 3.4s linear infinite, pdxSeamGlow 3.4s var(--ease-inout) infinite;\n}\n.pdx-seam::after {\n  content: \"\";\n  position: absolute; top: -1px; bottom: -1px; left: 0; width: 24%;\n  transform: translateX(-165%);\n  background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);\n  mix-blend-mode: screen; pointer-events: none;\n  animation: pdxSeamGlint 3.4s var(--ease-inout) infinite;\n}\n\n<\u002Fstyle>\n<style>\n*{box-sizing:border-box}\nbody{margin:0;background:radial-gradient(130% 90% at 18% -5%,#0b0910 0%,#060608 42%,#040405 100%);color:var(--text,#e6e2d9);font-family:var(--font-body,Inter,sans-serif);padding:34px}\na{color:var(--neon-cyan,#19e3ff)}a:hover{color:var(--neon-yellow,#cf0)}\n.lbl{font-family:var(--font-mono,ui-monospace,monospace);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6a6a72;margin:0 0 14px}\n.lbl+.lbl{margin-top:0}\nh1{font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:900;font-size:44px;line-height:.92;text-transform:uppercase;margin:0 0 10px;color:#fff}\n.lede{margin:0 0 30px;max-width:78ch;font-size:14px;line-height:1.6;color:#c8c4bb;text-wrap:pretty}\nh2{font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em;margin:38px 0 12px;color:#fff}\n/* ── top bar, values from index.css .site-hub-mtop ── */\n.mtop{display:flex;align-items:center;gap:10px;width:100%;max-width:430px;padding:10px 14px;background:#0a0a0c;border:1px solid #1c1c22;border-radius:12px}\n.mtop__mode{display:flex;gap:2px;padding:3px;background:#161616;border:1px solid #333;border-radius:99px}\n.mtop__btn{padding:6px 13px;border-radius:99px;font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:#b8b5ac}\n.mtop__btn.is-active{background:var(--neon-yellow,#CCFF00);color:#000}\n.mtop__spacer{flex:1}\n.bolt{position:relative;width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:9px;background:#1a1a1f;border:1px solid #333;color:#e8e5dc;cursor:pointer}\n.bolt svg{width:17px;height:17px}\n.bolt.is-alert{border-color:rgba(255,0,60,.55);color:#ff8ab8;box-shadow:0 0 14px rgba(255,40,40,.45)}\n.bolt b{position:absolute;top:-6px;right:-6px;font-family:var(--font-mono,ui-monospace,monospace);font-size:9px;background:#ff1fa0;color:#08080a;border-radius:99px;padding:1px 5px}\n.mtop__av{position:relative;width:39px;height:39px;flex:none;border-radius:50%;display:grid;place-items:center;isolation:isolate;\n  font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:900;font-size:14px;color:#000;background:#19e3ff}\n.mtop__av::before{content:\"\";position:absolute;inset:-6.5%;border-radius:50%;z-index:-1;opacity:.86;filter:blur(1.7px) saturate(1.2) brightness(1.12);\n  background:conic-gradient(from 220deg,#FF0018,#FFA52C,#FFFF41,#008018,#0000F9,#86007D,#000,#784F17,#5BCEFA,#F5A9B8,#fff,#FF0018)}\n.mtop__av i{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:#ff1fa0;border:1.5px solid #0a0a0c;box-shadow:0 0 8px rgba(255,0,204,.85)}\n.mtop__caret{width:24px;height:24px;flex:none;display:grid;place-items:center;background:none;border:0;color:#8a8a92;cursor:pointer}\n.mtop__caret svg{width:15px;height:15px}\n.mtop__join{padding:8px 16px;border-radius:99px;background:var(--neon-yellow,#CCFF00);color:#000;font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}\n\n/* ── the dock, values from hub-shell.css ── */\n.phone{width:390px;height:210px;position:relative;border-radius:18px;overflow:hidden;border:1px solid #1c1c22;background:linear-gradient(180deg,#0d0d10,#08080a)}\n.phone .body{position:absolute;inset:0 0 74px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono,ui-monospace,monospace);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#2f2f36}\n.bar{position:absolute;left:0;right:0;bottom:0;z-index:80;background:transparent;border-top:none;padding:10px 10px 8px;display:flex;justify-content:center;align-items:stretch;pointer-events:none}\n.dock{pointer-events:auto;position:relative;display:flex;width:100%;max-width:520px;margin:0 auto;gap:6px;align-items:stretch;justify-content:space-around;padding:8px;border-radius:22px;background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.04),transparent 55%),rgba(8,8,10,.94);border:1px solid #000;box-shadow:0 0 0 1px #000,0 -4px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}\n.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;min-width:0;background:rgba(255,255,255,.02);border:1px solid #000;border-radius:14px;color:#6e6e76;font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:8px 2px;position:relative;cursor:pointer;transition:color .15s ease,background .15s ease,box-shadow .15s ease}\n.tab svg{width:26px;height:26px;stroke-width:2.3;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}\n.tab.on.cyan{color:#19e3ff;background:color-mix(in srgb,#19e3ff 18%,#0a0a0e);box-shadow:0 0 18px -2px color-mix(in srgb,#19e3ff 70%,transparent),0 0 36px -8px color-mix(in srgb,#19e3ff 45%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}\n.tab.on.orange{color:#ff6600;background:color-mix(in srgb,#ff6600 16%,#0a0a0e);box-shadow:0 0 20px -2px color-mix(in srgb,#ff6600 75%,transparent),0 0 40px -8px color-mix(in srgb,#ff6600 50%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}\n.tab.on.lime{color:#ccff00;background:color-mix(in srgb,#ccff00 16%,#0a0a0e);box-shadow:0 0 20px -2px color-mix(in srgb,#ccff00 75%,transparent),0 0 40px -8px color-mix(in srgb,#ccff00 50%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}\n.tab.on.pink{color:#ff00cc;background:color-mix(in srgb,#ff00cc 16%,#0a0a0e);box-shadow:0 0 20px -2px color-mix(in srgb,#ff00cc 75%,transparent),0 0 40px -8px color-mix(in srgb,#ff00cc 50%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}\n.tab.on.green{color:#39ff14;background:color-mix(in srgb,#39ff14 16%,#0a0a0e);box-shadow:0 0 18px -2px color-mix(in srgb,#39ff14 70%,transparent),0 0 36px -8px color-mix(in srgb,#39ff14 45%,transparent),inset 0 1px 0 rgba(255,255,255,.08)}\n.iw{position:relative;display:inline-flex}\n.iw i{position:absolute;top:-8px;right:-12px;font-style:normal;font-size:11px;background:#ff00cc;color:#08080a;font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:800;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px}\n.zmark{width:28px;height:28px;border-radius:6px;display:block;object-fit:contain}\n.tab.on .zmark{filter:drop-shadow(0 0 6px rgba(25,227,255,.7))}\n/* ── sheet ── */\n.sheetrow{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}\n.sheet{width:300px;padding:16px 14px 10px;border-radius:18px;background:rgba(8,8,10,.96);border:1px solid #000;box-shadow:0 0 0 1px #000,0 -4px 28px rgba(0,0,0,.55)}\n.sheet h3{font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:800;font-size:18px;text-transform:uppercase;margin:0 0 12px;color:#fff}\n.sheetitem{display:flex;justify-content:space-between;padding:11px 12px;border-radius:10px;background:rgba(255,255,255,.02);border:1px solid #17171c;font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:#d6d6dc;margin-bottom:6px}\n.sheetitem.on{color:#ccff00;border-color:color-mix(in srgb,#ccff00 40%,#000)}\n/* ── spec grid ── */\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}\n.cell{padding:16px 18px;border:1px solid #1c1c22;border-radius:10px;background:#0c0c0f}\n.cell h4{font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px;color:#fff}\n.cell p{margin:0;font-size:12.5px;line-height:1.55;color:#999;text-wrap:pretty}\n.cell code{font-family:var(--font-mono,ui-monospace,monospace);font-size:11.5px;color:#19e3ff}\n.no{border-top:3px solid #FF4D4D}\n<\u002Fstyle><\u002Fhead>\n<body>\n<h1>Mobile nav<\u002Fh1>\n<p class=\"lede\">Mobile carries two bars, and they split the work. The top bar holds identity: where you are in the site, your alerts and your account. The bottom dock holds movement: the five places you actually go. Neither one duplicates the other, and the dock is portaled to <code style=\"font-family:var(--font-mono,monospace);font-size:12px;color:#19e3ff\">&lt;body&gt;<\u002Fcode> so iOS Safari cannot clip it.<\u002Fp>\n\n<h2 style=\"font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:900;font-size:24px;text-transform:uppercase;margin:34px 0 4px;color:#fff;padding-top:16px;border-top:2px solid #1c1c22\">Top bar<\u002Fh2>\n<p class=\"lede\" style=\"margin-bottom:18px\">Replaces the desktop nav row under 1024px. Home and About as a segmented pair on the left, then a spacer, then the alert bolt and the avatar cluster. Signed out, the cluster collapses to a single JOIN button.<\u002Fp>\n<div class=\"lbl\">Signed in, Home active, four alerts<\u002Fdiv>\n<div class=\"mtop\">\n  <div class=\"mtop__mode\">\n    <span class=\"mtop__btn is-active\">Home<\u002Fspan>\n    <span class=\"mtop__btn\">About<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"mtop__spacer\"><\u002Fdiv>\n  <button class=\"bolt is-alert\" type=\"button\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4 14h6l-1 8 9-12h-6l1-8Z\"><\u002Fpath><\u002Fsvg>\n    <b>4<\u002Fb>\n  <\u002Fbutton>\n  <span class=\"mtop__av\">TC<i><\u002Fi><\u002Fspan>\n  <button class=\"mtop__caret\" type=\"button\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<div class=\"lbl\">Signed out<\u002Fdiv>\n<div class=\"mtop\">\n  <div class=\"mtop__mode\">\n    <span class=\"mtop__btn is-active\">Home<\u002Fspan>\n    <span class=\"mtop__btn\">About<\u002Fspan>\n  <\u002Fdiv>\n  <div class=\"mtop__spacer\"><\u002Fdiv>\n  <span class=\"mtop__join\">Join<\u002Fspan>\n<\u002Fdiv>\n<div class=\"grid\" style=\"margin-top:16px\">\n  <div class=\"cell\"><h4>Segmented pair<\u002Fh4><p>Home and About sit in a <code>#161616<\u002Fcode> track with a <code>#333<\u002Fcode> edge. The active one fills and flips to black text; idle is <code>#b8b5ac<\u002Fcode> and goes white on hover.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Alert bolt<\u002Fh4><p>A lightning glyph on <code>#1a1a1f<\u002Fcode> with a <code>#333<\u002Fcode> edge. With anything pending it takes a red-tinted border, <code>#ff8ab8<\u002Fcode> text and a soft red glow, plus a count chip. Tapping opens a notification panel, at most 320px wide and 70vh tall, anchored right.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Avatar<\u002Fh4><p>39px here rather than the 55px default, with a 24px caret beside it. Same flag-ring bloom as everywhere else. It opens the same account menu as desktop.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>One overlay at a time<\u002Fh4><p>Opening the notify panel, the account menu, a tab sheet or the inbox dismisses the others through a single dismiss event. Two overlays can never stack.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"font-family:var(--font-display,'Barlow Condensed',sans-serif);font-weight:900;font-size:24px;text-transform:uppercase;margin:44px 0 4px;color:#fff;padding-top:16px;border-top:2px solid #1c1c22\">Bottom dock<\u002Fh2>\n<p class=\"lede\" style=\"margin-bottom:18px\">Places, Events, Hub, Boards, Messages. Events and Boards open sheets instead of navigating; Hub carries the Z mark; Messages opens the floating inbox. Hub and admin shells no longer render their own bars, so this is the only mobile bottom bar on the site.<\u002Fp>\n\n<div class=\"lbl\" style=\"margin-top:0\">The dock, Places active<\u002Fdiv>\n<div class=\"phone\">\n  <div class=\"body\">Page content<\u002Fdiv>\n  <div class=\"bar\"><div class=\"dock\">\n    <a class=\"tab on cyan\"><span class=\"iw\"><svg viewBox=\"0 0 24 24\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fspan><span>Places<\u002Fspan><\u002Fa>\n    <button class=\"tab\"><span class=\"iw\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Events<\u002Fspan><\u002Fbutton>\n    <a class=\"tab\"><img class=\"zmark\" src=\"2ceab358-946e-493f-9af6-249f59a3a0ed\" alt=\"\" width=\"28\" height=\"28\"><span>Hub<\u002Fspan><\u002Fa>\n    <button class=\"tab\"><span class=\"iw\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><\u002Fsvg><\u002Fspan><span>Boards<\u002Fspan><\u002Fbutton>\n    <button class=\"tab\"><span class=\"iw\"><svg viewBox=\"0 0 24 24\"><path d=\"M21 11.5a8.4 8.4 0 0 1-11.9 7.6L3 21l1.9-6.1A8.4 8.4 0 1 1 21 11.5Z\"><\u002Fpath><\u002Fsvg><i>3<\u002Fi><\u002Fspan><span>Messages<\u002Fspan><\u002Fbutton>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<h2>Every active state<\u002Fh2>\n<div class=\"lbl\">One accent per tab, fixed. The tab keeps its thin black outline; color arrives as fill, text and glow only.<\u002Fdiv>\n<div class=\"phone\" style=\"height:120px\">\n  <div class=\"bar\" style=\"bottom:auto;top:22px\"><div class=\"dock\">\n    <a class=\"tab on cyan\"><span class=\"iw\"><svg viewBox=\"0 0 24 24\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fspan><span>Cyan<\u002Fspan><\u002Fa>\n    <a class=\"tab on orange\"><span class=\"iw\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><path d=\"M16 2v4M8 2v4M3 10h18\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Orange<\u002Fspan><\u002Fa>\n    <a class=\"tab on lime\"><span class=\"iw\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><\u002Fsvg><\u002Fspan><span>Lime<\u002Fspan><\u002Fa>\n    <a class=\"tab on pink\"><span class=\"iw\"><svg viewBox=\"0 0 24 24\"><path d=\"M21 11.5a8.4 8.4 0 0 1-11.9 7.6L3 21l1.9-6.1A8.4 8.4 0 1 1 21 11.5Z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Pink<\u002Fspan><\u002Fa>\n    <a class=\"tab on green\"><span class=\"iw\"><svg viewBox=\"0 0 24 24\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Green<\u002Fspan><\u002Fa>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<h2>Tab sheets<\u002Fh2>\n<div class=\"lbl\">Events and Boards are buttons, not links. They open a sheet over a backdrop and close on route change.<\u002Fdiv>\n<div class=\"sheetrow\">\n  <div class=\"sheet\">\n    <h3>Events<\u002Fh3>\n    <div class=\"sheetitem on\"><span>Events<\u002Fspan><\u002Fdiv>\n    <div class=\"sheetitem\"><span>My Schedule<\u002Fspan><\u002Fdiv>\n    <div class=\"sheetitem\"><span>Nude Beaches<\u002Fspan><\u002Fdiv>\n    <div class=\"sheetitem\"><span>Promoters<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sheet\">\n    <h3>Boards<\u002Fh3>\n    <div class=\"sheetitem\"><span>Gig Board<\u002Fspan><\u002Fdiv>\n    <div class=\"sheetitem\"><span>Gifting<\u002Fspan><\u002Fdiv>\n    <div class=\"sheetitem\"><span>Missed Connections<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"cell\" style=\"flex:1;min-width:260px\">\n    <h4>Why sheets<\u002Fh4>\n    <p>Beaches folds into the Events sheet rather than taking a sixth tab. Boards holds the three community boards. Opening one dismisses the other overlays through a single dismiss event, so a sheet, the notify menu and the inbox can never stack.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<h2>Specification<\u002Fh2>\n<div class=\"grid\">\n  <div class=\"cell\"><h4>Rail<\u002Fh4><p>Fixed, full width, <code>z-index 80<\u002Fcode>, transparent, no top border, <code>pointer-events:none<\u002Fcode>. Padding <code>10px 10px calc(8px + safe-area)<\u002Fcode>. The rail is a hit-test hole; only the dock takes input.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Dock chip<\u002Fh4><p>Max width 520px, centered, radius 22px, <code>rgba(8,8,10,.94)<\u002Fcode> under a 4% white radial sheen, <code>1px solid #000<\u002Fcode> plus <code>0 0 0 1px #000<\u002Fcode>, lift shadow <code>0 -4px 28px rgba(0,0,0,.55)<\u002Fcode>, inset top highlight 6%.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Tab<\u002Fh4><p>Min height 56px, radius 14px, <code>1px solid #000<\u002Fcode> at every state, idle text <code>#6e6e76<\u002Fcode> on 2% white, display font 700 at 10.5px, 0.06em, uppercase. Icons 26px at 2.3 stroke.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Active<\u002Fh4><p>Fill is <code>color-mix(accent 16%, #0a0a0e)<\u002Fcode>, 18% for cyan and violet. Two-stop neon glow at 70 to 75% and 45 to 50%. Border stays black. Never a colored border, never an outer ring.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Accents<\u002Fh4><p>Places cyan <code>#19e3ff<\u002Fcode>, Events orange <code>#ff6600<\u002Fcode>, Hub cyan, Boards lime <code>#ccff00<\u002Fcode>, Messages pink <code>#ff00cc<\u002Fcode>. Green <code>#39ff14<\u002Fcode> and violet exist for hub-shell tabs. Fixed per tab, never day colors.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Center tab<\u002Fh4><p>Hub renders the Z mark asset (<code>assets/z-mark-nav.png<\u002Fcode> in the client, the app face export here) at 28px, never a house icon. Signed out it opens the auth modal instead of routing.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Badge<\u002Fh4><p>Messages carries the attention count: pink chip, dark text, <code>top:-8px right:-12px<\u002Fcode>, capped at <code>9+<\u002Fcode>. It sums unread DMs plus the admin queue plus the owner desk.<\u002Fp><\u002Fdiv>\n  <div class=\"cell\"><h4>Calm mode<\u002Fh4><p>Calm and reduced motion drop the glow on active tabs and hold the fill. Nothing pulses.<\u002Fp><\u002Fdiv>\n  <div class=\"cell no\"><h4>Never<\u002Fh4><p>No sitewide cyan pull above the bar: that was retired. The grip belongs to the hub drawer only. Do not add a sixth tab, and do not give the dock a neon edge.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"lede\" style=\"margin-top:26px\">Source: <code>client/src/components/Nav.tsx<\u002Fcode> (top bar), <code>client/src/components/MobileBottomNav.tsx<\u002Fcode>, <code>client/src/lib/siteNav.ts<\u002Fcode> (EVENTS_NAV, BOARD_NAV), <code>client/src/components/hub/hub-shell.css<\u002Fcode>, <code>client/src/index.css<\u002Fcode> (search <code>site-hub-mobile-bar<\u002Fcode>).<\u002Fp>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
