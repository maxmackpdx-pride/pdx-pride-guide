<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{ margin:0; background:radial-gradient(130% 90% at 18% -5%, #0b0910 0%, #060608 42%, #040405 100%); padding:30px; }
  .lbl{ font-family:var(--font-mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-faint); margin:30px 0 14px; }
  .lbl:first-child{ margin-top:0; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:22px; align-items:start; }
  .ads{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:24px; align-items:start; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { BoardCard, AdCard, FeedItem } = window.PDXPrideGuideDesignSystem_b20420;
  const A = "../../assets/avatars/";
  const L = "../../assets/venue-logos/";
  function Demo(){
    return (
      <div>
        <div className="lbl">Community board posts (motif + GIVE / ISO rail)</div>
        <div className="grid">
          <BoardCard board="spotted" title="Suspenders & a golden retriever" meta="Sat 5pm" where="Dyke March" cta="Reply"
            text="You smiled at me while I handed out water at the corner. Coffee before the week ends?" />
          <BoardCard board="gifting" kind="give" title="3 pairs of platform boots" meta="Size 9" where="Pearl District" cta="Claim"
            text="Rehoming gently-worn club platforms. Porch pickup, no questions. Take one pair or all three." />
          <BoardCard board="gifting" kind="iso" title="ISO folding tables for a booth" meta="Borrow" where="SE Portland" cta="Offer"
            text="Need two folding tables for a vendor booth Saturday. Returned Sunday, or I'll pay it forward." />
          <BoardCard board="gigs" kind="give" title="DJ, Sunday drag brunch" meta="Paid" where="Stag PDX" cta="Apply"
            text="Last-minute fill-in needed, Sun 11am to 3pm. Disco/pop, bring your own controller." />
          <BoardCard board="gigs" kind="iso" title="Bar back, free all weekend" meta="ISO work" where="Will travel" cta="Offer gig"
            text="Experienced bar back and barista, open all events. Can start same day." />
        </div>

        <div className="lbl">Hub scene feed (neutral glass)</div>
        <div className="grid">
          <FeedItem name="Joel Kimmel-Staebler" action="is going · 4h ago" avatar={A+"bigfoot.webp"} initial="J" status="rsvp" statusLabel="RSVP"
            attachment={{ title: "Stank x Yes Coach: Events", sub: "Sanctuary · 3 going", color: "var(--green)" }}>I'll be there</FeedItem>
          <FeedItem name="Twink O Yea" action="posted on Gig Werk · 2d ago" avatar={A+"skate.webp"} initial="T" status="looking" statusLabel="Looking" rainbowTop>
            im open to all paid work please reach out, im in a financial bind</FeedItem>
        </div>

        <div className="lbl">Affiliate ad slots (read as event cards)</div>
        <div className="ads">
          <AdCard variant="grid" logo={L+"Pizza_Thief.png"} logoText="Logo" title="Pizza Thief" tags={["Partner","Local"]}
            description="Poster-style grid ad that reads as an event card. The partner's own logo sits in the well." note="Shop the link, support the guide" cta="Shop now" />
          <AdCard variant="feed" logo={L+"Mis_Tacones.png"} logoText="Brand" title="Meet CockBlock Stroke"
            subcopy="The only frot toy for people with a penis · New hand-held design · Gay owned"
            note="10% Off · Code: TuckerMax" code="cockblocktoys.com · Free US & CA shipping" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
</body>
</html>
