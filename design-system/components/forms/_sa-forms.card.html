<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../_sa-styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{ margin:0; background:var(--bg-app); padding:26px; }
  .row{ display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-bottom:22px; }
  .row:last-child{ margin-bottom:0; }
  .lbl{ font-family:var(--font-body); font-weight:600; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
        color:var(--text-lo); width:100%; margin-bottom:-4px; }
  /* Home hero glass pill, ported from .home-hero__btn in client/src/pages/Home.css */
  .heroStage{ width:100%; padding:26px 22px; border-radius:12px; border:1px solid #1c1c22;
    background:radial-gradient(120% 100% at 30% 0%, #16121d 0%, #0a0a0c 60%); display:flex; gap:16px; flex-wrap:wrap; }
  .heroBtn{ display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--font-display,'Barlow Condensed',sans-serif); font-weight:800; font-size:16px;
    letter-spacing:.06em; text-transform:uppercase; text-decoration:none; border-radius:999px;
    padding:14px 26px; line-height:1; border:1px solid rgba(255,255,255,.14);
    background:rgba(0,0,0,.72); backdrop-filter:blur(14px) saturate(1.15); -webkit-backdrop-filter:blur(14px) saturate(1.15);
    box-shadow:0 0 0 1px rgba(0,0,0,.55), 0 8px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    color:#fff; cursor:pointer;
    transition:transform .12s ease, color .12s ease, border-color .12s ease, box-shadow .12s ease; }
  .heroBtn:hover{ transform:translateY(-2px); border-color:rgba(255,255,255,.28);
    box-shadow:0 0 0 1px rgba(0,0,0,.55), 0 12px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12); }
  .heroBtn--primary:hover{ color:#ccff00; border-color:color-mix(in srgb,#ccff00 45%, rgba(255,255,255,.2)); }
  .heroBtn--river:hover{ color:#ff6600; border-color:color-mix(in srgb,#ff6600 45%, rgba(255,255,255,.2)); }
  .heroBtn--secondary{ color:#00ffff; }
  .heroBtn--secondary:hover{ color:#7dfbff; border-color:rgba(0,255,255,.35); }
  .heroNote{ width:100%; font-size:12px; line-height:1.55; color:#8f8f8f; text-wrap:pretty; }
  .heroNote code{ font-family:var(--font-mono); font-size:11px; color:#19e3ff; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton, SearchInput, FilterChip } = window.PDXPrideGuideDesignSystem_b20420;

  function Demo(){
    const [q,setQ] = React.useState("Darcelle");
    const [free,setFree] = React.useState(true);
    const [tick,setTick] = React.useState(true);
    const [day,setDay] = React.useState("SAT");
    React.useEffect(()=>{ const go=()=>window.lucide && window.lucide.createIcons(); go(); [60,300,900].forEach(ms=>setTimeout(go,ms)); });
    return (
      <div>
        <div className="row">
          <span className="lbl">Home hero glass pill · the first panel on the home screen</span>
          <div className="heroStage">
            <a className="heroBtn heroBtn--primary" href="#" onClick={(e)=>e.preventDefault()}>View all events &rarr;</a>
            <a className="heroBtn heroBtn--river" href="#" onClick={(e)=>e.preventDefault()}>Headed to the river? &rarr;</a>
            <a className="heroBtn heroBtn--secondary" href="#" onClick={(e)=>e.preventDefault()}>Your Hub &rarr;</a>
          </div>
          <p className="heroNote">Round black glass, not a neon outline and not the brutal offset. A 1px white-14% edge over <code>rgba(0,0,0,.72)</code> with a 14px backdrop blur at 1.15 saturation, a three-layer depth shadow, and a white label. Hover lifts 2px and swaps the label to that route's accent: lime for events, orange for the river, cyan for the Hub. Hero only, every other CTA stays on the Button component.</p>
        </div>
        <div className="row">
          <p className="heroNote" style={{marginBottom:2}}>Chrome sits on the same OLED chassis as the cards: a black keyline, a 1px top bevel, a floor shade, and a tight accent bloom underneath. Hover lifts 1px and blooms wider, press sinks 1px and cuts the bloom, and <code>:focus-visible</code> swaps in a 3px cyan ring. Calm mode nulls only <code>--chrome-bloom</code>, so the chassis survives.</p>
        </div>
        <div className="row">
          <span className="lbl">Buttons, glass secondary (default), acid primary, outline, gradient, ghost</span>
          <Button variant="solid" accent="lime" arrow>View All Events</Button>
          <Button accent="cyan" arrow>Message Host</Button>
          <Button accent="pink">Add to Calendar</Button>
          <Button variant="outline" accent="cyan">Add to Calendar</Button>
          <Button variant="gradient" arrow>Submit Event</Button>
          <Button variant="ghost" accent="cyan">Cancel</Button>
          <Button accent="lime" live>Happening Now</Button>
        </div>
        <div className="row">
          <span className="lbl">Sizes + icon buttons</span>
          <Button variant="solid" accent="lime" size="sm">Small</Button>
          <Button variant="solid" accent="lime" size="md">Medium</Button>
          <Button variant="solid" accent="lime" size="lg">Large</Button>
          <IconButton label="Share" variant="outline"><i data-lucide="share-2"></i></IconButton>
          <IconButton label="Save" variant="solid"><i data-lucide="heart"></i></IconButton>
          <IconButton label="Map" variant="ghost"><i data-lucide="map-pin"></i></IconButton>
        </div>
        <div className="row">
          <span className="lbl">Filter chips, outline-selected + fill-selected</span>
          <FilterChip selected accent="lime" count={52}>All</FilterChip>
          <FilterChip selected={day==="THU"} onToggle={()=>setDay("THU")} accent="cyan">Thu</FilterChip>
          <FilterChip selected={day==="SAT"} onToggle={()=>setDay("SAT")} accent="green">Sat</FilterChip>
          <FilterChip fill selected={free} onToggle={()=>setFree(v=>!v)} accent="lime" count={18}>Free</FilterChip>
          <FilterChip fill selected={tick} onToggle={()=>setTick(v=>!v)} accent="cyan" count={31}>Ticketed</FilterChip>
        </div>
        <div className="row">
          <span className="lbl">Search</span>
          <div style={{flex:1, minWidth:280}}>
            <SearchInput value={q} onChange={e=>setQ(e.target.value)} onClear={()=>setQ("")} placeholder="Search events..." />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script>
<template id="__bundler_thumbnail" data-bg-color="#0a0a0a"><svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="80" fill="#0a0a0a"/><text x="60" y="52" font-family="sans-serif" font-size="34" font-weight="900" fill="#CCFF00" text-anchor="middle">Z</text></svg></template>
</body>
</html>
