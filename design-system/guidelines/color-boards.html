<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="_spec.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
  body{margin:0;background:var(--bg-app);padding:22px;font-family:var(--font-body)}
  .row{display:flex;flex-wrap:wrap;gap:14px}
  .cell{width:158px}
  .cell[data-token]{cursor:pointer}
  .tok{font-family:var(--font-mono,ui-monospace,monospace);font-size:10px;color:var(--neon-cyan);margin-top:5px}
  .cell:hover .tok{color:var(--neon-yellow)}
  .cell.copied .tok{color:var(--status-good)}
  .cell.copied .tok::after{content:" copied"}
  .hint{font-family:var(--font-mono,ui-monospace,monospace);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-disabled);margin:16px 0 0}
  .sw{height:62px;border-radius:4px}
  .nm{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:16px;color:#fff;margin-top:9px;letter-spacing:.01em}
  .rule{height:3px;border-radius:2px;margin-top:6px}
  .sub{font-family:var(--font-mono,ui-monospace,monospace);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-top:7px}
</style></head><body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "spotted": "#FF00CC",
    "gifting": "#CCFF00",
    "gigs": "#8800FF",
    "housing": "#00FFFF"
  }/*EDITMODE-END*/;

  function App(){
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    const boards = [
      { name: "MISSED CONNECTION", tok: "--board-spotted", c: t.spotted, mid: "var(--panel-magenta)", sub: "Magenta · soft --panel-magenta on tabs" },
      { name: "Gifting",           tok: "--board-gifting", c: t.gifting, mid: null,                    sub: "Acid yellow · free board" },
      { name: "Gig Board",         tok: "--board-gigs",    c: t.gigs,    mid: "var(--panel-purple)",   sub: "Violet · soft --panel-purple on tabs" },
      { name: "Housing",           tok: "--board-housing", c: t.housing, mid: "var(--panel-cyan)",     sub: "Cyan · soft --panel-cyan on tabs" },
    ];
    return (
      <div>
        <div className="row">
          {boards.map((b) => (
            <div className="cell" key={b.name} data-token={b.tok} title={"Copy " + b.tok}>
              <div className="sw" style={{ background: b.c, boxShadow: `0 0 18px color-mix(in srgb, ${b.c} 28%, transparent)` }}></div>
              <div className="nm">{b.name}</div>
              <div className="rule" style={{ background: b.mid
                ? `linear-gradient(90deg, ${b.c}, ${b.mid} 60%, transparent)`
                : `linear-gradient(90deg, ${b.c}, transparent)` }}></div>
              <div className="tok">{b.tok}</div>
              <div className="sub">{b.sub}</div>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 16, padding: "12px 14px", background: "var(--panel-card)", border: "2px solid var(--panel-border)", borderRadius: 6 }}>
          <span style={{ fontFamily: "var(--font-mono)", fontSize: 10, letterSpacing: ".18em", textTransform: "uppercase", color: "var(--board-muted)" }}>Board text</span>
          <div style={{ marginTop: 6, fontSize: 13, color: "var(--board-text)" }}>Boards read warm paper text <code style={{ color: "var(--board-muted)" }}>--board-text #F4F1EA</code> · muted <code style={{ color: "var(--board-muted)" }}>--board-muted #BDBAB2</code></div>
        </div>
        <p className="hint">Click any board to copy its token name.</p>
        <TweaksPanel>
          <TweakSection label="Board accents" />
          <TweakColor label="Missed Connection" value={t.spotted} options={["#FF00CC","#FF1493","#FF3131","#C400FF"]} onChange={(v)=>setTweak("spotted", v)} />
          <TweakColor label="Gifting" value={t.gifting} options={["#CCFF00","#AEEA00","#FFEE00","#39FF14"]} onChange={(v)=>setTweak("gifting", v)} />
          <TweakColor label="Gig Board" value={t.gigs} options={["#8800FF","#B026FF","#6A5CFF","#00E5FF"]} onChange={(v)=>setTweak("gigs", v)} />
          <TweakColor label="Housing" value={t.housing} options={["#00FFFF","#19E3FF","#00E5FF","#34D5C5"]} onChange={(v)=>setTweak("housing", v)} />
        </TweaksPanel>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body></html>
