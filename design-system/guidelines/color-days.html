<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><script src="_spec.js"></script>
<style>
body{margin:0;background:var(--bg-app);padding:22px;font-family:var(--font-body);color:var(--text-body)}
.cap{font-family:var(--font-mono);font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--neon-cyan);margin:0 0 12px}
section{margin-bottom:24px}
.sp-sw .lbl{font-size:15px;font-weight:900}
.dates{display:flex;flex-wrap:wrap;gap:12px;margin-top:-6px}
.hint{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-disabled);margin:0}
.note{font-size:12px;color:var(--text-lo);line-height:1.5;max-width:70ch;margin:0 0 14px;text-wrap:pretty}
</style></head><body>
<p class="note">Day colors are data. Reach for <code style="font-family:var(--font-mono);color:var(--neon-cyan)">var(--day-*)</code> and never the hex, so calm mode can flatten the whole week at once.</p>
<section><div class="cap">The week</div><div id="days"></div></section>
<section><div class="cap">Text-safe variants &amp; the multi-day key</div><div id="extra"></div><div id="multi" style="margin-top:12px"></div></section>
<p class="hint">Click any swatch to copy its token name.</p>
<script>
const DATES={"--day-mon":"Mon · Jul 13","--day-tue":"Tue · Jul 14","--day-wed":"Wed · Jul 15","--day-thu":"Thu · Jul 16","--day-fri":"Fri · Jul 17","--day-sat":"Sat · Jul 18","--day-sun":"Sun · Jul 19"};
Spec.grid("#days", Object.keys(DATES).map(k=>[k,DATES[k],{shape:"circle",glow:1}]), {w:96,h:46});
Spec.grid("#extra", [["--day-mon-text","Mon on dark",{text:1}],["--day-tue-text","Tue on dark",{text:1}],["--day-unknown","No day",{shape:"circle"}]], {w:110,h:46});
const v=Spec.read("--day-multi");
document.getElementById("multi").innerHTML='<button class="sp-sw" data-token="--day-multi" style="--sp-w:100%" title="Copy --day-multi"><div class="chip" style="height:30px;background:'+v+'"></div><div class="lbl">Multi-day venue</div><div class="tok">--day-multi</div><div class="val">built from the seven day tokens, so calm mode reaches it</div></button>';
</script>
</body></html>
