<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Improved Stank Event Card Mockup</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.gradient-hero {
  background: linear-gradient(135deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f);
  animation: gradient 15s ease infinite;
}
@keyframes gradient {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}
</style>
</head>
<body class="bg-zinc-950 text-white p-8">
<div class="max-w-lg mx-auto bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl border border-purple-500">
  <!-- App header -->
  <div class="flex items-center justify-between px-6 py-4 border-b">
    <div class="flex gap-2">
      <div class="px-4 py-1 bg-zinc-800 rounded-full text-sm">HOME</div>
      <div class="px-4 py-1 bg-zinc-800 rounded-full text-sm">ABOUT</div>
    </div>
    <div>3:43 • 5G+ • 29%</div>
  </div>
  
  <!-- Post header -->
  <div class="p-4 flex items-center gap-3">
    <div class="w-10 h-10 bg-orange-500 rounded-full flex items-center justify-center text-xl">👨</div>
    <div>
      <div class="font-bold">TUCKER_PDMAX</div>
      <div class="text-zinc-400 text-sm">POSTED A HOST UPDATE • 40H AGO</div>
    </div>
  </div>
  
  <div class="px-4 pb-2">
    <p class="text-lg">If you have friends on the fence, highly recommend they get a ticket ASAP</p>
  </div>
  
  <!-- Improved Event Card -->
  <div class="mx-4 mb-6 rounded-3xl overflow-hidden border border-zinc-700">
    <div class="gradient-hero h-80 flex flex-col justify-center items-center text-center p-8 relative">
      <div class="absolute top-6 left-6 px-4 py-1 bg-black/70 rounded-2xl text-xs font-bold tracking-widest">LÉMIX PRESENTS</div>
      <h1 class="text-7xl font-black tracking-[-4px] text-black leading-none">STANK</h1>
      <h1 class="text-6xl font-black tracking-[-3px] text-black -mt-3">x YES COACH</h1>
      <div class="text-3xl font-bold mt-2 text-purple-600">PRIDE WEEKEND</div>
      <div class="mt-auto w-full text-center">
        <div class="inline-flex items-center gap-2 bg-black/60 px-6 py-2 rounded-3xl text-sm">
          <span>SANCTUARY</span>
          <span class="text-emerald-400">• 2 GOING</span>
        </div>
      </div>
    </div>
    <div class="p-6 bg-zinc-900">
      <button class="w-full bg-emerald-500 text-black py-4 rounded-2xl font-bold text-xl">GET TICKETS →</button>
      <div class="text-xs text-center mt-4 text-zinc-400">THU JUL 16 • 9PM • 21+</div>
    </div>
  </div>
</div>
</body>
</html>
