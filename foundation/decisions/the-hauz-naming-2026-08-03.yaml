id: ZF-THE-HAUZ-NAMING-2026-08-03
title: THE HAÜZ public identity and route
date: 2026-08-03
status: founder-direction
owner: Tucker_PDmaX
authority: Tucker's explicit decision
context: >-
  The housing board appeared under Housing, Hausing, Haüsing, HAUSING, and
  HAÜSING across product surfaces, guides, routes, and brand materials. Tucker
  directed one exact product-family name: THE HAÜZ.
decision:
  public_name: THE HAÜZ
  exact_spelling: >-
    Always render the public product name as THE HAÜZ in full uppercase, with
    the word THE, a space, the umlaut over Ü, and a terminal Z. Do not use
    THEHAÜZ, HAÜZ, Housing, Hausing, Haüsing, HAUSING, HAÜSING, ZayHaus, or
    ZAYHAÜS as the product label.
  canonical_route: /the-hauz
  compatibility_routes:
    - /hausing redirects permanently to /the-hauz
    - /housing redirects permanently to /the-hauz
  api_compatibility: >-
    Existing /api/housing endpoints, payload fields, schemas, database names,
    and API-facing type contracts remain unchanged. This naming decision does
    not authorize an API migration.
  household_term: >-
    HAÜS may remain the noun for an individual household formed inside THE
    HAÜZ. The product is THE HAÜZ; a household is a HAÜS.
  artwork: >-
    Create and use a THE HAÜZ logo-family candidate. Preserve older ZAYHAÜS
    artwork as superseded history rather than presenting it as the current mark.
rationale: >-
  One exact name strengthens the Zaylist product family, removes public naming
  drift, and gives the board a durable canonical URL without breaking existing
  API consumers or old links.
alternatives:
  - Keep HAÜSING
  - Keep descriptive Housing labels
  - Rename API contracts in the same migration
consequences:
  - Product UI, metadata, accessibility text, current guides, and brand material
    use THE HAÜZ.
  - New public links use /the-hauz.
  - Old public links redirect instead of breaking.
  - API contracts remain housing-compatible.
related_decisions:
  - ZF-005
  - ZF-BOARD-NAMING-UPPERCASE-2026-08-03
implementation_state: implemented-locally
review_date: null
