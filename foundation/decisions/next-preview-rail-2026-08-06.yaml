id: ZF-NEXT-PREVIEW-RAIL-2026-08-06
title: Next preview brand-family stack becomes a horizontal rail
date: 2026-08-06
status: accepted
owner: Tucker_PDmaX
authority: Tucker's explicit decision
context: >-
  The home page Next preview renders six brand-family cards as a floating stack
  with an IntersectionObserver, per-card float delays, and drift offsets.
decision:
  change: >-
    Replace the floating stack with a horizontal scroll-snap rail.
  preserved: >-
    The contour map wallpaper and the Explore Next call to action stay as they
    are. Cards use the live --glass-card-* recipe.
  scope_limit: >-
    This was the only site change accepted on 2026-08-06. No other work from that
    session ships.
rationale: >-
  A rail removes code rather than adding it. No observer, no landed state, no
  prefersStillMotion fallback. Six cards in a stack leave five partially occluded;
  in a rail all are equally readable and a seventh brand costs nothing.
alternatives:
  - Keep the stack. Tucker likes its crashing animation and it remains an option if
    a better animation is not found.
consequences:
  - Surface area is NextPreviewCardStack in pages/Home.tsx and the
    home-next-preview__* rules in Home.css.
  - The existing crash animation, homeNextCrashLeft and homeNextCrashRight, would be
    retired for this component unless deliberately preserved.
related_decisions: []
sources:
  - foundation/explorations/2026-08-06-z-namespace-and-product-shape.md#E-14
implementation_state: not-implemented
review_date: null
