id: ZF-Z-OUT-NAME-2026-08-06
title: TRAVELZ is renamed Z/Out and scoped to outdoors rec finding
date: 2026-08-06
status: accepted
owner: Tucker_PDmaX
authority: Tucker's explicit decision
context: >-
  TRAVELZ appears as waypoint 06 on the Next page with people-first copy about
  finding someone for a trail, campground, or road trip.
decision:
  public_name: Z/Out
  scope: Outdoors rec finding.
  contains: >-
    Nude beaches will live under Z/Out in modified form, alongside other outdoor
    recreation destination types.
rationale: >-
  Z/Out is a container holding a category, which satisfies the Z/ rule. Nude
  beaches is a destination type inside outdoor recreation, not a product.
consequences:
  - Waypoint 06 copy is people-first matching and no longer matches a place-first
    discovery product. Copy must change, not only the name.
  - Nude beaches currently holds the 01 feature slot on the home stage. Whether it
    keeps that slot after moving under Z/Out is an open owner decision.
  - The existing beach conditions widget generalizes to trailheads, campgrounds,
    and swimming holes. It is the prototype for the Z/Out data model.
  - No z-out.svg exists. A wordmark is required, and per ZF-Z-NAMESPACE it should
    be typeset rather than drawn.
alternatives:
  - Keep TRAVELZ. Rejected by Tucker.
related_decisions:
  - ZF-Z-NAMESPACE-2026-08-06
sources:
  - foundation/explorations/2026-08-06-z-namespace-and-product-shape.md#E-01
implementation_state: not-implemented
review_date: null
