id: ZF-BOARD-NAMING-UPPERCASE-2026-08-03
title: GIGZ and GIFZ public names
date: 2026-08-03
status: superseded
owner: Tucker_PDmaX
authority: Tucker's explicit decision
context: >-
  The prior public labels GigZ and GiftZ did not fully express the Zaylist
  product-family naming system. Tucker directed that Gigs become GIGZ and
  Gifting become GIFZ across the product, Foundation, design guides, and brand
  materials.
decision:
  public_names:
    work_board: GIGZ
    gifting_board: GIFZ
    anonymous_connection_board: Mizzed Connection
  exact_spelling: >-
    GIGZ and GIFZ are wordmarks and public product names. Always render both in
    full uppercase. Do not use GIGZ, GIFZ, Gigs, Gifting, or Gig Board as a
    public board label.
  compatibility: >-
    Existing routes, database object names, API names, code identifiers, asset
    paths, and analytics identifiers may remain gigs or gifting until a
    separately planned technical migration is justified. They must not leak as
    public labels.
  artwork: >-
    Use the current GIGZ and GIFZ logo-family candidates where artwork is
    appropriate. Text-only UI uses the same exact uppercase spelling.
rationale: >-
  Exact product-family names create a stronger relationship to Zaylist and
  remove casing drift across navigation, profiles, inbox context, safety copy,
  guides, and brand assets without risking stable URLs or stored data.
alternatives:
  - Keep mixed-case GigZ and GiftZ
  - Keep descriptive labels such as Gigs, Gifting, or Gig Board
consequences:
  - Public UI and current documentation use GIGZ and GIFZ consistently.
  - Generic lowercase words such as gigs may remain inside ordinary sentences
    when they describe work rather than name the GIGZ product.
  - Internal compatibility identifiers remain unchanged.
  - Historical records retain the spelling that was current at the time and
    point to this superseding decision.
related_decisions:
  - ZF-BOARD-NAMING-2026-08-03
  - ZF-005
  - ZF-007
implementation_state: implemented-locally
review_date: null
superseded_by: ZF-BOARD-NAMING-2026-08-04
