id: ZF-NO-PAYMENT-RAIL-2026-08-06
title: Zaylist is listing-only and never processes payments
date: 2026-08-06
status: accepted
owner: Tucker_PDmaX
authority: Tucker's explicit decision
context: >-
  Planned commerce categories include gifts, sex gear resale, and art. An Etsy
  comparison for art raised the question of whether the platform would need a
  payment rail.
decision:
  rule: >-
    Zaylist takes no payments for anything. A listing for art is no different
    than a listing for a used harness. People arrange transactions themselves.
  scope: Gifts, gear, art, and any future commerce category.
  borrowing: >-
    Etsy is referenced for browse and discovery shape only, never for its
    business model.
rationale: >-
  Gifts, gear, and art are one object with different tags. Adding a payment rail
  for one of them would add processor risk for all of them.
consequences:
  - No restricted-category exposure. Adult goods are a restricted category for
    mainstream processors; listing-only avoids the question entirely.
  - No chargebacks, no PCI scope, no refund disputes, no processor dependency.
  - Passes the solo-founder test. Nothing here requires financial operations.
  - Revenue, if any, must come from somewhere other than transactions.
related_decisions:
  - ZF-PLATFORM-SHAPE-2026-08-06
sources:
  - foundation/explorations/2026-08-06-z-namespace-and-product-shape.md#E-12
implementation_state: not-implemented
review_date: null
