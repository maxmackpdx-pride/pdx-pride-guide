id: ZF-GIGZ-IDENTITY-LAYER-2026-08-06
title: Gigz is the identity and verification layer; creator networking lives inside it
date: 2026-08-06
status: accepted
owner: Tucker_PDmaX
authority: Tucker's explicit decision
context: >-
  Tucker raised a Z/Creatorz landing page with its own verification process so
  adult content creators could find each other, then agreed it belongs in Gigz.
  Gigz was separately described as becoming a kind of dark LinkedIn.
decision:
  rule: >-
    Gigz is the professional and identity layer for the platform. Adult content
    creators are one segment within it, not a separate product.
  verification_tiers:
    - Age verified. Standard users, 18+, unlocks ZayDark Mode.
    - Identity verified. Creators, verified name and age on file, badge visible to peers.
  landing_page: >-
    A creators landing page may exist as marketing for a Gigz segment, not as a
    product of its own.
  naming: >-
    Z/Creatorz is invalid as written. It carries both the container prefix and the
    product suffix. Choose one.
rationale: >-
  Coat check work, a DJ booking, and an adult scene collaboration are the same
  object: work and the people verified to do it. Creator networking publishes no
  explicit content itself, which makes it the most defensible surface on the
  roadmap.
consequences:
  - THE HAUZ roommate matching, ZayDark age gating, and creator collaboration all
    draw on one verified identity rather than three.
  - Federal 2257 record-keeping is a real burden adult creators already carry. A
    network where age and identity are established before contact solves an existing
    problem rather than adding a gate.
  - The identity-verified tier is plausibly paid, which is notable on a platform that
    takes no money anywhere else. See ZF-NO-PAYMENT-RAIL for the tension.
related_decisions:
  - ZF-ZAYDARK-MODE-2026-08-06
  - ZF-NO-PAYMENT-RAIL-2026-08-06
sources:
