id: ZF-SPOTZ-NAME-2026-08-06
title: Places is renamed The Spotz, with ownership and safety as separate badges
date: 2026-08-06
status: accepted
owner: Tucker_PDmaX
authority: Tucker's explicit decision
context: >-
  Places is a queer business directory, but not every queer-friendly business is
  queer-owned. Tucker found a single label conflating the two dishonest and
  muddy, and wanted a one-word name.
decision:
  public_name: The Spotz
  naming_rule: >-
    The name claims neither ownership nor safety. It names the container.
  attributes: >-
    Queer-owned is an ownership fact and should be a verified badge. Queer-safe
    is an experience fact and should be driven by reports, not self-declaration.
    A business must not be able to grant itself the safety badge.
  scope: Bars, venues, restaurants, shops, and services.
rationale: >-
  Separating ownership from experience removes the need to adjudicate whether a
  business is queer enough, which is the argument that kills directories. The
  definite article makes it a curated known set rather than a category, which is
  a curation claim the platform can actually keep.
alternatives:
  - SHOPZ. Rejected. Venues are in the directory and you do not shop a venue.
  - HAUNTS. Rejected. Unfamiliar to the owner, therefore unfamiliar to users.
  - Keep Places. Honest and neutral but flat and generic.
consequences:
  - Nav treatment is unresolved. The Spotz is clunky as a tab label beside Events
    and Gigz; likely follows the THE HAUZ pattern of full lockup as brand and bare
    word in navigation.
  - A safety badge requires a reporting and moderation mechanism before launch.
  - Venue records overlap with events. Whether a venue is one object surfaced in
    both remains an open question.
