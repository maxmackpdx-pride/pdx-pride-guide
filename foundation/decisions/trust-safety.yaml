id: ZF-TRUST-SAFETY-2026-08-04
title: Trust and Safety Library domain and watcher
date: 2026-08-04
status: founder-direction
owner: Tucker_PDmaX
authority: Tucker's explicit direction
context: >-
  Member blocking, report access, contextual privacy guidance, accessibility,
  interaction-state clarity, and product-experience metrics now span several
  product surfaces but lacked one durable Library home and one bounded
  operational steward.
decision: >-
  Place Trust & Safety at the top of the Foundation Library. Maintain one
  human-first and agent-readable standard plus a recurring read-only Trust &
  Safety Watcher that checks enforcement, discovery, completion, counter
  consistency, accessibility, privacy, consent, policy freshness, and
  unresolved risk.
rationale: >-
  Trust is a platform condition rather than a feature. A compact governed watch
  process gives one founder continuity without granting an agent moderation,
  policy, member-contact, production, or publishing authority.
alternatives:
  - Keep safety guidance scattered across product pages and conversations
  - Create a fully autonomous moderation agent
  - Measure engagement without safety and privacy guardrails
consequences:
  - The Library presents Trust & Safety before design-system instruction.
  - The watcher may observe, preserve evidence, classify severity, and recommend action.
  - Tucker retains final policy, moderation, product, and publishing authority.
  - Critical and high findings route outside the weekly summary cadence.
  - Analytics remain allowlisted, aggregate, denominator-aware, and content-free.
related_decisions:
