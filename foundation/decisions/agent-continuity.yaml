id: ZF-AGENT-CONTINUITY-2026-08-03
title: Agent Continuity Ledger
date: 2026-08-03
status: founder-direction
owner: Tucker_PDmaX
authority: Tucker's explicit direction
context: >-
  Zaylist work spans ordinary ChatGPT conversations, Codex tasks, recurring agents,
  and specialist handoffs. Important decisions and unknowns can be lost or distorted
  when a later conversation lacks the earlier context.
decision: >-
  Maintain a private, agent-readable continuity ledger beside the Foundation. Agents
  may periodically append concise, source-linked notes with explicit status and
  confidentiality labels. The ledger is operational memory, not canonical authority.
rationale: >-
  A small governed ledger improves continuity without copying complete chats,
  exposing private context, or allowing agent-generated recommendations to become law.
consequences:
  - Agents may append notes using the governed template.
  - Tucker's explicit approval is required before promotion into a durable decision.
  - NDA-protected context remains inside the authorized Zaylist workspace.
  - Public materials may use only content explicitly labeled public-approved.
  - Superseded notes remain archived rather than silently rewritten.
alternatives:
  - Depend on chat memory alone
  - Copy complete transcripts into the Foundation
  - Let each agent maintain a separate undocumented memory store
related_decisions:
  - DS-001
  - DS-010
implementation_state: implemented-locally
review_date: 2026-09-03
