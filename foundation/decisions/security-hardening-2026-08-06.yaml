id: ZF-SECURITY-HARDENING-2026-08-06
title: Security hardening deferred until exit from beta
date: 2026-08-06
status: deferred
owner: Tucker_PDmaX
authority: Tucker's explicit decision
context: >-
  A GitHub personal access token with repo write was pasted into a working chat
  and used in shell commands. The repo auto-deploys to production on push to
  master, so a repo-write token is effectively a production deploy key. Audit on
  2026-08-06 found the token was not committed and no other secret patterns exist
  in the working tree or history, so no history rewrite is required.
decision:
  posture: >-
    Broad security hardening is deliberately deferred. The project is small, in
    beta, and the exposure is acceptable at current scale. This is a considered
    risk acceptance, not an oversight.
  trigger: >-
    Hardening happens once the site bones and structure are complete, before
    coming out of beta for the third go-live. That launch is the gate; do not
    launch through it with this record still deferred.
  not_deferred: >-
    Rotating the exposed token is not part of the deferral. It is a five minute
    task and blast radius does not scale with project size: a repo-write token on
    an auto-deploying repo means push access to production.
  scope_when_triggered:
    - Replace broad repo-scope tokens with fine-grained tokens scoped to this
      repository only, contents read/write plus workflow.
    - No credential in a git remote URL; scripts read from a file with mode 600.
    - No secret pasted into any chat, ever. Agents that need to push read from the
      token file rather than being handed a value.
    - .gitignore covers token and credential filename patterns.
    - Secret scanning on push.
    - Dependency vulnerability audit.
    - Review Railway environment variables and deploy triggers.
    - Confirm no secret reachable from the client bundle.
rationale: >-
  Hardening a beta with a handful of users has a real cost in time that is better
  spent on the product, and the honest risk today is low. Recording the deferral
  with a trigger is what keeps it from becoming a thing everyone remembers
  intending to do. An intention stated in a chat does not survive; a deferred
  record with a named gate does.
alternatives:
  - Harden now. Rejected as disproportionate to current scale and to a one founder
    build.
  - Leave it unrecorded and handle it at launch. Rejected; this is exactly the
    category of work that evaporates between now and then.
consequences:
  - This record is a launch blocker by design. Moving out of beta requires either
    completing the scope above or an explicit owner decision to accept the risk
    again with a new date.
  - Until then, treat the repo token as sensitive and never paste one into a chat.
  - Agents needing push access read from the token file. An agent that cannot
    reach it produces files and hands the push to an agent that can, per
    ZF-AGENT-ROUTING-2026-08-06.
related_decisions:
  - ZF-AGENT-ROUTING-2026-08-06
sources:
  - Repo audit 2026-08-06 - no secrets in working tree or git history
implementation_state: not-implemented
review_date: exit-from-beta
