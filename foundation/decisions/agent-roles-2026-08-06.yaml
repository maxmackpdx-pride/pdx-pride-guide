id: ZF-AGENT-ROLES-2026-08-06
title: Agent roles, and preservation of Grok's fast path to production
date: 2026-08-06
status: accepted
owner: Tucker_PDmaX
authority: Tucker's explicit decision
context: >-
  Several models work this repo, sometimes in the same hour. Operating standards
  were previously taught one conversation at a time, so each new model relearned
  them and some was lost each time. Roles were never written down at all, which
  meant capability differences were rediscovered rather than used deliberately.
decision:
  shared_standard: >-
    Every agent follows foundation/agent-continuity/onboarding.md. The standards
    do not vary by model. Role describes what an agent is best pointed at, never
    which rules apply to it.
  roles:
    grok:
      role: Fast path to production. Quick fixes.
      basis: >-
        Grok works from the terminal and can get a change onto Railway faster
        than any other agent. That speed is a real capability, not a convenience.
      preserve: >-
        Do not route Grok through workflows that add latency to an urgent
        production fix, and do not replace his direct terminal and push access
        with an intermediated path. Preserving this is an explicit owner
        decision, not an accident of tooling.
      best_for: >-
        Live-site bugs, urgent regressions, deploy verification, terminal-side
        checks against the real filesystem and the running service.
    claude:
      role: Library, documentation, design reasoning, specimen work.
      best_for: >-
        Decision records, chapters, explorations, design system analysis,
        long-form reasoning, and work where being wrong slowly costs less than
        being fast.
    codex:
      role: Implementation and repo-wide change.
      best_for: >-
        Multi-file refactors, feature build-out, and structural work across the
        codebase.
  role_limits: >-
    Role does not confer authority. No agent's role lets it skip the divergence
    gate, invent Foundation approval, push without confirmation, or treat its
    own recommendation as accepted.
rationale: >-
  Writing the standard down once ends the per-model reteaching loop and stops
  operating knowledge from decaying between sessions. Writing the roles down
  makes capability differences usable on purpose. Grok's speed to production
  only helps if it is protected from being designed away by someone optimizing
  for uniformity.
alternatives:
  - Keep teaching each model in conversation. This is the current state and is how
    the knowledge was being lost.
  - Give every agent an identical workflow. Rejected; it would erase the speed
    advantage that makes urgent fixes possible.
consequences:
  - onboarding.md is required reading for every agent before its first change.
  - Grok's terminal and direct push access is a protected capability. Changing it
    is an owner decision, not a tooling cleanup.
  - Urgent production fixes route to Grok by default.
  - Standards remain uniform even though speed and surface do not.
related_decisions:
  - ZF-AGENT-CONTINUITY
sources:
