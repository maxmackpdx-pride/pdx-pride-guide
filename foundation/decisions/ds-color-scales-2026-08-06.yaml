id: DS-COLOR-SCALES-2026-08-06
title: Derived 12-step scales for the nine neon tokens
date: 2026-08-06
status: recommendation
owner: Tucker_PDmaX
authority: Foundation recommendation, awaiting owner decision
context: >-
  Measured the nine live neon tokens in client/src/index.css against the app
  background #050506. The palette spans a 5.1x contrast range with no scale
  beneath it. --neon-blue at 3.2:1, --neon-violet at 3.4:1, and --board-gigs at
  3.7:1 fall below the 4.5:1 minimum for body text.
decision:
  proposal: >-
    Derive a 12-step scale per hue in OKLCH with hue held constant and chroma
    clamped to sRGB. Step 9 remains the live token, unmodified. Steps 1 to 8
    supply backgrounds, fills, and borders; steps 10 to 12 supply hover and two
    guaranteed text weights.
  text_target: 6.0:1 for step 11, matching the values already chosen by hand.
  evidence: >-
    --day-mon-text (#AA66FF) and --day-tue-text (#4488FF) already exist as hand
    patched lightened variants at 5.9:1 and 6.0:1. Derived step 11 reproduced
    them at OKLCH lightness 0.659 against 0.656, and 0.645 against 0.645.
rationale: >-
  The two hand-patched variants show the pattern was already invented under
  pressure for the two hues that broke visibly. Seven hues never received one.
  Deriving the scale extends existing instinct rather than replacing judgment.
alternatives:
  - Continue hand patching per hue as problems surface. This is the current state
    and is how --board-gigs reached 3.7:1 with no text variant.
  - Adopt Radix Colors wholesale. Rejected; it would replace the live tokens rather
    than derive from them.
consequences:
  - Foundational color tokens are system wide, so this sits behind the major
    divergence gate and requires an explicit owner decision.
  - No live token value changes. Step 9 is the current hex in every scale.
  - The two ad hoc -text variables would be replaced by a rule covering all nine hues.
  - The seven Next page world accents are largely already clean; only Places red and
    Missed connections need a nudge.
related_decisions: []
sources:
