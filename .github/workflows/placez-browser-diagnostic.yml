name: PlaceZ bounded compiler diagnosis
on:
  push:
    branches: [placez/six-browser-diagnostic]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
      - run: npm ci --include=dev
      - run: node script/prepare-map-release.mjs client/public
      - run: npx playwright install --with-deps chromium
      - name: Diagnose exact six-venue optimized comparison
        run: timeout --signal=TERM --kill-after=30s 10m node --test script/placez-six-compiler-production.test.mjs
      - name: Preserve raw comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: placez-compiler-diagnostic
          path: artifacts/placez-artwork/six
          retention-days: 7
