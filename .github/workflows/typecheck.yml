name: Typecheck and CSS audit

on:
  pull_request:
  push:

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
      - run: npm ci --include=dev
      - name: Run regression tests
        run: npx tsx --test server/platformV1.test.ts server/ingest/mirrorEventPosters.test.ts client/src/lib/optimisticCache.test.ts client/src/lib/authSession.test.ts client/src/lib/queryClient.test.ts client/src/lib/timeAgo.test.ts script/nav-tripwire.test.ts script/token-guard.test.mjs server/sessionStore.test.ts server/passwords.test.ts script/design-component-source-evidence.test.ts script/prepare-design-component-proposal.test.ts script/design-product-publication.test.ts script/verify-railway-design-build.test.ts client/src/lib/boardFollowChoices.test.ts script/home-halloween.test.ts script/mapz-nightlife.test.mjs script/map-startup-delivery.test.ts script/node-runtime.test.mjs server/publicEventFeedCache.test.ts server/publicEventFeedRoute.test.ts client/src/lib/responsivePoster.test.ts server/posterVariants.test.ts script/profile-declaration-emitter.test.mjs script/route-map-imports.test.mjs

  glass-rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"

      - name: Test glass audit parser
        run: node --test script/audit-glass-rebind.test.mjs

      - name: Audit glass --c rebind
        run: node script/audit-glass-rebind.mjs

  card-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
      - run: npm ci --include=dev
      - name: Shared card and image preparation regression tests
        run: node --import tsx --test client/src/components/cards/*.test.ts client/src/components/cards-fixed-size.test.ts script/outzide-image-preparation.test.mjs
      - name: Install browser for actual layout checks
        run: npx playwright install --with-deps chromium
      - name: Verify card sizes, anchors, reflow and dismissal
        run: node --test --test-concurrency=1 script/card-api-browser.test.mjs script/card-route-browser.test.mjs script/card-small-heart-browser.test.mjs script/card-mobile-scroll-browser.test.mjs script/incidental-map-browser.test.mjs script/incidental-map-webgl-browser.test.mjs script/place-map-carousel-browser.test.mjs script/event-location-map-browser.test.mjs script/home-map-intent-browser.test.mjs script/motion-runtime-browser.test.mjs script/outz-photo-sizes-browser.test.mjs script/responsive-poster-browser.test.mjs
