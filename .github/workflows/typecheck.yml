name: Typecheck and CSS audit

on:
  pull_request:
  push:

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --include=dev
      - name: Run regression tests
        run: npx tsx --test server/platformV1.test.ts server/ingest/mirrorEventPosters.test.ts client/src/lib/optimisticCache.test.ts client/src/lib/authSession.test.ts client/src/lib/queryClient.test.ts server/sessionStore.test.ts server/passwords.test.ts

  glass-rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit glass --c rebind
        run: node script/audit-glass-rebind.mjs
