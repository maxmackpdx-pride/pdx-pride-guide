name: Foundation release discipline

# The Foundation's llms.txt files carry a Release id. Agents use it to tell
# whether their cached view of a guide is current. If content moves and the id
# does not, every cached agent view goes stale undetectably.
#
# This job fails when a governed Foundation area changes without its llms.txt
# release id changing too. Run it locally with:
#   node scripts/check-foundation-release.mjs <base> <head>

on:
  push:
    branches: [master]
    paths:
      - "foundation/**"
      - "scripts/check-foundation-release.mjs"
      - ".github/workflows/foundation-release.yml"
  pull_request:
    paths:
      - "foundation/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: foundation-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve diff range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=HEAD~1" >> "$GITHUB_OUTPUT"
            echo "head=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release ids
        run: node scripts/check-foundation-release.mjs "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      - name: Explain on failure
        if: failure()
        run: |
          {
            echo '## Foundation release discipline failed'
            echo
            echo 'A governed Foundation area changed without its `llms.txt` release id moving.'
            echo 'Bump the trailing number, or roll the date and reset to `.1`, then push again.'
            echo
            echo 'Format: `Release: zaylist-<area>-YYYY-MM-DD.N`'
          } >> "$GITHUB_STEP_SUMMARY"
