name: Deploy to Railway

on:
  push:
    branches:
      - master
    paths-ignore:
      - "reports/**"

# Solo-developer pipeline (Tucker, Nov 15, 2026): Railway's GitHub integration
# deploys master on its own. This workflow no longer runs test or design-guard
# jobs that made deploys look stuck or failed after the fact. It only preserves
# the rollback tag and verifies the live deployment actually landed.
concurrency:
  group: railway-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  map-rollback-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Preserve pre-launch production rollback
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/pre-five-mode-map-v1.0.0-20261107';
            const sha = '4bc990e0599ca5629d1336767c0452d1cd3b33a9';
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            let current;
            try { current = (await github.rest.git.getRef({...repo, ref})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (current && current.object.sha !== sha) throw new Error('Pre-launch rollback tag does not match recorded production baseline');
            if (!current) await github.rest.git.createRef({...repo, ref: 'refs/' + ref, sha});
            core.info('Verified rollback ' + ref + ' -> ' + sha);

  # Railway's GitHub integration deploys master on its own (about 22 to 25 minutes).
  # This job starts immediately so health verification is not stuck behind npm ci.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"

      - name: Verify Railway deployment
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: node script/verify-live-deployment.mjs
