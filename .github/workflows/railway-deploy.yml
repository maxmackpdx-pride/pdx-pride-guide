name: Deploy to Railway

on:
  push:
    branches:
      - master
    paths-ignore:
      - "reports/**"

# Queue deploys — cancel-in-progress caused overlapping Railway deploys that
# showed up as CRASHED/REMOVED in the dashboard and failed GitHub Actions runs.
concurrency:
  group: railway-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Pre-ship design and bundle guards
        run: npm run ship

      - name: Verify approved design publication
        id: design_publication
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(npm run --silent design:publication -- discover)
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          if [ -n "$manifest" ]; then
            npm run --silent design:publication -- verify --proposal "$manifest" --output "$RUNNER_TEMP/design-publication-input.json"
          fi

      - name: Prepare Foundation release attestation
        id: prepare_publication
        if: steps.design_publication.outputs.manifest != ''
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent design:publication -- prepare --input "$RUNNER_TEMP/design-publication-input.json" --output "$RUNNER_TEMP/design-publication-state.json"
          publication_id=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).id)" "$RUNNER_TEMP/design-publication-state.json")
          echo "publication_id=$publication_id" >> "$GITHUB_OUTPUT"

      # Railway's connected GitHub service deploys every push to master.
      # Verify that native deployment here instead of triggering a duplicate
      # GraphQL deploy with a separate project token that can expire.
      - name: Verify Railway deployment
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          HEALTH_URL="https://www.zaylist.com/api/health"

          for i in $(seq 1 90); do
            response=$(curl -fsS --max-time 20 "$HEALTH_URL" 2>/dev/null || true)
            live_sha=$(printf '%s' "$response" | jq -r '.gitSha // empty' 2>/dev/null || true)
            deployment_id=$(printf '%s' "$response" | jq -r '.deploymentId // empty' 2>/dev/null || true)
            echo "Poll $i: live=${live_sha:-unavailable} expected=$COMMIT_SHA deployment=${deployment_id:-unknown}"

            if [ "$live_sha" = "$COMMIT_SHA" ]; then
              echo "Railway production deployment verified at $deployment_id"
              exit 0
            fi

            sleep 10
          done

          echo "Timed out waiting for Railway production to serve $COMMIT_SHA"
          exit 1

      - name: Complete Foundation release attestation
        if: steps.prepare_publication.outputs.publication_id != ''
        run: npm run --silent design:publication -- complete --state "$RUNNER_TEMP/design-publication-state.json"

      - name: Record failed Foundation release attestation
        if: failure() && steps.prepare_publication.outputs.publication_id != ''
        continue-on-error: true
        run: npm run --silent design:publication -- fail --state "$RUNNER_TEMP/design-publication-state.json" --reason product-deployment-or-verification-failed
