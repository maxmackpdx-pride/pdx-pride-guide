name: Deploy to Railway

on:
  push:
    branches:
      - master
    paths-ignore:
      - "reports/**"

# Preserve waiting checks as well as active checks. Railway remains the sole
# deployment trigger; this workflow never cancels, removes, or redeploys a release.
concurrency:
  group: railway-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Deployment verification regression tests
        run: node --test script/verify-live-deployment.test.mjs

      - name: Pre-ship design and bundle guards
        run: npm run ship

      # Railway's connected GitHub service deploys every push to master.
      # Verify that native deployment here instead of triggering a duplicate
      # GraphQL deploy with a separate project token that can expire.
      - name: Verify Railway deployment
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: node script/verify-live-deployment.mjs
