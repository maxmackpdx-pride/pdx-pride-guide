name: Deploy to Railway

on:
  push:
    branches:
      - master
    paths-ignore:
      - "reports/**"

# Queue deploys — cancel-in-progress caused overlapping Railway deploys that
# showed up as CRASHED/REMOVED in the dashboard and failed GitHub Actions runs.
concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Pre-ship design and bundle guards
        run: npm run ship

      # Railway's GitHub integration deploys master. This job verifies that
      # native deployment instead of issuing a second, token-authenticated
      # deployment request through Railway's private GraphQL mutation.
      - name: Verify native Railway deployment
        env:
          SITE_URL: https://www.zaylist.com
        run: |
          set -euo pipefail
          for poll in $(seq 1 75); do
            response=$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              "$SITE_URL/api/health" 2>/dev/null || true)
            live_sha=$(printf '%s' "$response" | jq -r '.gitSha // empty' 2>/dev/null || true)
            current_master_sha=$(git ls-remote origin refs/heads/master | awk '{print $1}')

            if [ -n "$live_sha" ] && [ "$live_sha" = "$current_master_sha" ]; then
              echo "Native Railway deployment is live at $live_sha."
              exit 0
            fi

            echo "Poll $poll: live=${live_sha:-unavailable}, current-master=${current_master_sha:-unavailable}; waiting for Railway."
            sleep 8
          done

          echo "Timed out waiting for Railway to serve the current master revision."
          exit 1
