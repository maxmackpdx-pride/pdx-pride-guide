name: Deploy to Railway

on:
  push:
    branches:
      - master
    paths-ignore:
      - "reports/**"

# Preserve waiting checks as well as active checks. Railway remains the sole
# deployment trigger; this workflow never cancels, removes, or redeploys a release.
concurrency:
  group: railway-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  map-rollback-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Preserve pre-launch production rollback
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/pre-five-mode-map-v1.0.0-20261107';
            const sha = '4bc990e0599ca5629d1336767c0452d1cd3b33a9';
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            let current;
            try { current = (await github.rest.git.getRef({...repo, ref})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (current && current.object.sha !== sha) throw new Error('Pre-launch rollback tag does not match recorded production baseline');
            if (!current) await github.rest.git.createRef({...repo, ref: 'refs/' + ref, sha});
            core.info('Verified rollback ' + ref + ' -> ' + sha);

  deploy:
    needs: map-rollback-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Deployment verification regression tests
        run: node --test script/verify-live-deployment.test.mjs

      - name: Unified map source, host and social-gate regressions
        run: node --import tsx --test script/map-release.test.mjs client/src/lib/mapBookmarks.test.ts client/src/lib/mapHostTokens.test.ts server/mapSocialContent.test.ts server/mapSocialRoutes.test.ts

      - name: Pre-ship design and bundle guards
        run: npm run ship

  # Railway's GitHub integration deploys master on its own (about 22 to 25 minutes).
  # This job starts immediately so health verification is not stuck behind npm ci.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"

      - name: Verify Railway deployment
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: node script/verify-live-deployment.mjs
