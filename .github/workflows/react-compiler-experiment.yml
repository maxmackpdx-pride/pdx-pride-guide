name: React Compiler experiment validation

on:
  push:
    branches:
      - experiment/react19-card-render-boundaries
  pull_request:
    branches: [master]
    paths:
      - "client/src/components/cards/experimental/**"
      - "script/react-compiler-smoke.mjs"
      - "script/react-compiler-card-scope.mjs"
      - "script/react-compiler-card-scope.d.mts"
      - "script/react-compiler-production-scope.mjs"
      - "script/react-card-profile-browser.test.mjs"
      - "script/react-compiler-comparison-browser.test.mjs"
      - "script/react-production-card-compiler-comparison.test.mjs"
      - "script/fixtures/react-compiler-card-benchmark.tsx"
      - "script/fixtures/card-api-browser.tsx"
      - "script/node-runtime.test.mjs"
      - ".github/workflows/react-compiler-experiment.yml"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
  workflow_dispatch:

# Only the nonproduction experiment branch receives an automatically regenerated
# lockfile. No deployment or merge is performed by this workflow.
permissions:
  contents: write

concurrency:
  group: react-compiler-experiment-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use production Node version
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Resolve lockfile from official npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile update to the experiment branch only
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(experiment): synchronize React Compiler dependency lockfile"
          git push origin HEAD:experiment/react19-card-render-boundaries
      - name: Install with frozen lockfile
        run: npm ci --include=dev
      - name: Verify compiler is performing real transforms
        run: node script/react-compiler-smoke.mjs
      - name: Verify actual Vite app card-only Compiler scope
        run: node script/react-compiler-production-scope.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Mapz regression suite
        run: npm run test:mapz
      - name: Platform regression suite
        run: npm run test:platform
      - name: Build with current release lock
        run: npm run build
      - name: Verify deployment bundle
        run: npm run verify:deploy
      - name: Install browser for card regression tests
        run: npx playwright install --with-deps chromium
      - name: Profile existing production card components (baseline)
        run: node --test --test-concurrency=1 script/react-card-profile-browser.test.mjs
      - name: Compare actual production card rendering with and without Compiler
        run: node --test --test-concurrency=1 script/react-production-card-compiler-comparison.test.mjs
      - name: Compare compiled and uncompiled experimental card renders
        run: node --test --test-concurrency=1 script/react-compiler-comparison-browser.test.mjs
      - name: Check card expansion and motion
        run: node --test --test-concurrency=1 script/card-api-browser.test.mjs script/card-route-browser.test.mjs script/motion-runtime-browser.test.mjs
