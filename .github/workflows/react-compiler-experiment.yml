name: React Compiler experiment validation

on:
  push:
    branches:
      - experiment/react19-card-render-boundaries
  pull_request:
    branches: [master]
    paths:
      - "client/src/components/cards/experimental/**"
      - "script/react-compiler-smoke.mjs"
      - "script/react-compiler-card-scope.mjs"
      - "script/react-compiler-card-scope.d.mts"
      - "script/react-compiler-production-scope.mjs"
      - "script/react-card-profile-browser.test.mjs"
      - "script/react-compiler-comparison-browser.test.mjs"
      - "script/react-production-card-compiler-comparison.test.mjs"
      - "script/react-production-like-card-profile-browser.test.mjs"
      - "script/react-whole-page-profile-compare.mjs"
      - "script/card-route-browser.test.mjs"
      - "script/fixtures/card-route-browser.tsx"
      - "script/fixtures/production-card-profiler.html"
      - "script/fixtures/react-compiler-card-benchmark.tsx"
      - "script/fixtures/card-api-browser.tsx"
      - "script/node-runtime.test.mjs"
      - ".github/workflows/react-compiler-experiment.yml"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
  workflow_dispatch:

# Only the nonproduction experiment branch receives an automatically regenerated
# lockfile. No deployment or merge is performed by this workflow.
permissions:
  contents: write

concurrency:
  group: react-compiler-experiment-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Use production Node version
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm
      - name: Resolve lockfile from official npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile update to the experiment branch only
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(experiment): synchronize React Compiler dependency lockfile"
          git push origin HEAD:experiment/react19-card-render-boundaries
      - name: Install with frozen lockfile
        run: npm ci --include=dev
      - name: Syntax-check optimized profiling fixture
        run: node --check script/react-production-like-card-profile-browser.test.mjs
      - name: Verify compiler is performing real transforms
        run: node script/react-compiler-smoke.mjs
      - name: Verify actual Vite app card-only Compiler scope
        run: node script/react-compiler-production-scope.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Mapz regression suite
        run: npm run test:mapz
      - name: Platform regression suite
        run: npm run test:platform
      - name: Build with current release lock
        run: npm run build
      - name: Verify deployment bundle
        run: npm run verify:deploy
      - name: Install browser for card regression tests
        run: npx playwright install --with-deps chromium webkit
      - name: Check WebKit resource anchor early (strict geometry assertion)
        run: CARD_ROUTE_QA_BROWSER=webkit CARD_ROUTE_QA_FOCUS=grid-resources node --test --test-concurrency=1 script/card-route-browser.test.mjs
      - name: Check WebKit Boardz grid independently (strict route and geometry assertions)
        run: xvfb-run -a env DEBUG=pw:browser CARD_ROUTE_QA_WEBKIT_HEADED=1 CARD_ROUTE_QA_BROWSER=webkit CARD_ROUTE_QA_FOCUS=grid-boards node --test --test-concurrency=1 script/card-route-browser.test.mjs
      - name: Profile existing production card components (baseline)
        run: node --test --test-concurrency=1 script/react-card-profile-browser.test.mjs
      - name: Compare actual production card rendering with and without Compiler
        run: node --test --test-concurrency=1 script/react-production-card-compiler-comparison.test.mjs
      - name: Compare production-optimized real cards with React profiling builds
        run: node --test --test-concurrency=1 script/react-production-like-card-profile-browser.test.mjs
      - name: Profile actual Resources, Boards and Directory page trees in balanced mode order
        run: |
          node --check script/card-route-browser.test.mjs
          node --check script/react-whole-page-profile-compare.mjs
          # Each round runs both Compiler modes, reversing which runs first on
          # alternate rounds. Preserve every fingerprint/duration/commit assertion.
          for round in 1 2 3 4; do
            if [ $((round % 2)) -eq 1 ]; then order="off infer"; else order="infer off"; fi
            for mode in $order; do
              if [ "$mode" = "infer" ]; then compiler=1; else compiler=0; fi
              echo "Page profile round $round mode $mode"
              CARD_ROUTE_QA_FOCUS=page-profile CARD_ROUTE_QA_PROFILE_ROUND="$round" CARD_ROUTE_QA_COMPILER="$compiler" CARD_ROUTE_QA_PROFILE_OUTPUT="/tmp/zay-page-${mode}-${round}.json" node --test --test-concurrency=1 script/card-route-browser.test.mjs
            done
          done
          node script/react-whole-page-profile-compare.mjs "/tmp/zay-page-off-1.json,/tmp/zay-page-off-2.json,/tmp/zay-page-off-3.json,/tmp/zay-page-off-4.json" "/tmp/zay-page-infer-1.json,/tmp/zay-page-infer-2.json,/tmp/zay-page-infer-3.json,/tmp/zay-page-infer-4.json"
      - name: Compare compiled and uncompiled experimental card renders
        run: node --test --test-concurrency=1 script/react-compiler-comparison-browser.test.mjs
      - name: Check card expansion and motion
        run: node --test --test-concurrency=1 script/card-api-browser.test.mjs script/card-route-browser.test.mjs script/motion-runtime-browser.test.mjs
      - name: Check real card route expansion with scoped Compiler enabled
        run: CARD_ROUTE_QA_COMPILER=1 node --test --test-concurrency=1 script/card-route-browser.test.mjs
      - name: Check WebKit route, mobile and motion parity with Compiler off and scoped infer
        run: |
          xvfb-run -a env CARD_ROUTE_QA_WEBKIT_HEADED=1 CARD_ROUTE_QA_BROWSER=webkit node --test --test-concurrency=1 script/card-route-browser.test.mjs
          xvfb-run -a env CARD_ROUTE_QA_WEBKIT_HEADED=1 CARD_ROUTE_QA_BROWSER=webkit CARD_ROUTE_QA_COMPILER=1 node --test --test-concurrency=1 script/card-route-browser.test.mjs
