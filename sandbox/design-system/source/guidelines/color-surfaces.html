<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-app);padding:22px;font-family:var(--font-body)}

.row{display:flex;flex-wrap:wrap;gap:10px}</style></head><body><div class="row"><div style="width:96px"><div style="height:50px;border-radius:4px;background:#0a0a0a;border:2px solid var(--border-default)"></div><div style="font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:12px;color:#fff;margin-top:6px">App</div><div style="font-size:10px;color:var(--text-lo)">#0a0a0a</div></div><div style="width:96px"><div style="height:50px;border-radius:4px;background:#0b0b0b;border:2px solid var(--border-default)"></div><div style="font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:12px;color:#fff;margin-top:6px">Card</div><div style="font-size:10px;color:var(--text-lo)">#0b0b0b</div></div><div style="width:96px"><div style="height:50px;border-radius:4px;background:#141414;border:2px solid var(--border-default)"></div><div style="font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:12px;color:#fff;margin-top:6px">Raised</div><div style="font-size:10px;color:var(--text-lo)">#141414</div></div><div style="width:96px"><div style="height:50px;border-radius:4px;background:#2b2b2b;border:2px solid var(--border-default)"></div><div style="font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:12px;color:#fff;margin-top:6px">Border</div><div style="font-size:10px;color:var(--text-lo)">#2b2b2b</div></div>
<div style="width:220px;padding-left:14px;border-left:1px solid var(--border-default)">

<div style="color:var(--text-mid)">Body #e6e3da</div>
<div style="color:var(--text-lo);font-size:14px">Meta #999999</div>
<div style="color:var(--text-faint);font-size:12px">Faint #666666</div></div></div></body></html>
