<!-- @startingPoint section="Zaylist" subtitle="Full community event-guide site" viewport="1280x860" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zaylist</title>
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="app.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script>
<style>
  html,body{ margin:0; background:var(--bg-app); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="EventsScreen.jsx"></script>
<script type="text/babel" src="PlacesScreen.jsx"></script>
<script type="text/babel" src="HubScreen.jsx"></script>
<script type="text/babel" src="AdminScreen.jsx"></script>

<script type="text/babel" data-presets="react">
  const { useState } = React;

  function App(){
    const data = window.PDX_DATA;
    const [route, setRoute] = useState("home");
    const [saved, setSaved] = useState({});
    const [toast, setToast] = useState(null);

    const onSave = (id) => setSaved((m) => ({ ...m, [id]: !m[id] }));
    const onRsvp = (id) => { setToast("You're on the list. See you there! ✦"); setTimeout(() => setToast(null), 2200); };
    const nav = (r) => { setRoute(r); window.scrollTo(0, 0); };

    const Header = window.PGHeader, Footer = window.PGFooter;
    let Screen = null;
    if (route === "home")   Screen = <window.PGHomeScreen  data={data} saved={saved} onSave={onSave} onRsvp={onRsvp} onNav={nav} />;
    else if (route === "events") Screen = <window.PGEventsScreen data={data} saved={saved} onSave={onSave} onRsvp={onRsvp} />;
    else if (route === "places") Screen = <window.PGPlacesScreen data={data} />;
    else if (route === "hub")    Screen = <window.PGHubScreen onNav={nav} />;
    else if (route === "admin")  Screen = <window.PGAdminScreen />;
    else Screen = <window.PGHomeScreen data={data} saved={saved} onSave={onSave} onRsvp={onRsvp} onNav={nav} />;

    return (
      <div className="pg-app">
        <Header route={route} onNav={nav} />
        {Screen}
        <Footer onNav={nav} />
        {toast && (
          <div style={{ position:"fixed", left:"50%", bottom:28, transform:"translateX(-50%)", zIndex:1000,
            background:"var(--neon-yellow)", color:"#000", fontFamily:"var(--font-display)", fontWeight:700,
            letterSpacing:".04em", textTransform:"uppercase", padding:"12px 22px", borderRadius:"4px",
            boxShadow:"4px 4px 0 rgba(255,0,204,.4)" }}>{toast}</div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
